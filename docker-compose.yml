services:
  # ============================================================
  # Infrastructure
  #
  # These bindings stay LITERAL 127.0.0.1 — deliberately NOT ${BIND_ADDR}.
  # BIND_ADDR exists so an operator can publish the APP ports to a LAN or the
  # internet; nothing about that decision should also publish the datastores.
  # Redis here has no password at all, Qdrant holds every memory in plaintext,
  # and Neo4j's password lives in the same .env an exposed service could leak.
  # Need one of these remotely? Tunnel it (ssh -L 6379:127.0.0.1:6379 host)
  # instead of widening the binding.
  #
  # IMAGE PINS — every image here is `tag@sha256:digest`, and both halves earn
  # their place. The DIGEST is what makes the pin immutable: these images are
  # not built here, so without it a customer's `docker compose pull` fetches
  # whatever the tag happens to point at on the day they install, and two
  # installs a month apart are different products. The TAG is kept beside it so
  # a human can read this file and know what is running — a bare digest is
  # unreviewable, and an unreviewable pin is one nobody ever audits.
  #
  # Two things a floating tag can change with no commit and no review: the
  # LICENCE of what we ship (see redis below — this already happened) and the
  # on-disk data format (see neo4j below). That is why this is pinned rather
  # than merely tidy.
  #
  # To move a pin deliberately:
  #   docker buildx imagetools inspect <tag>     # take the TOP-LEVEL Digest
  # That top-level value is the manifest-list (multi-arch index) digest. Do not
  # use one of the per-platform digests listed underneath it — that pins the
  # stack to a single architecture and breaks every other one. Never "fix" a
  # pull failure by deleting the digest to get the latest.
  # ============================================================

  neo4j:
    # 5.26.28 — the version the old floating `5-community` tag resolved to on
    # 2026-07-26. Licence: GPLv3 (read from /var/lib/neo4j/LICENSE.txt inside
    # this exact image; community edition).
    #
    # This pin is not just reproducibility — Neo4j store-format upgrades are
    # ONE-WAY. Not every version bump migrates the store, but when one does it
    # happens automatically on first start and there is no downgrade path; the
    # only way back is a restore from backup. On the old floating tag a
    # customer running `docker compose pull` could be carried across a 5.x
    # minor and migrated into a store their previous binary can no longer
    # open, having chosen nothing. Moving this pin is a decision that needs a
    # backup and a rollback plan, never an incidental refresh.
    image: neo4j:5.26.28-community@sha256:362542416de6c09a971484d1893878016cc3b5cdec166e54b1c824a220ecd6b9
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

  qdrant:
    # Apache-2.0. This image ships no licence file of its own, so unlike the
    # others here the claim comes from the upstream LICENSE at tag v1.13.2 in
    # the repo the image's own org.opencontainers.image.source label points to.
    # The chain closes because the image self-reports the same version twice:
    # an org.opencontainers.image.version label of v1.13.2, and `qdrant
    # --version` printing 1.13.2 from inside this digest.
    #
    # Already version-pinned, digest added anyway: a tag can be re-pushed, so
    # `v1.13.2` alone is a promise, not a guarantee. The digest is the guarantee.
    image: qdrant/qdrant:v1.13.2@sha256:81bdf0a9deedbeec68eed207145ade0b9d5db15e2f84069180711aa9698445b1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  redis:
    # 7.4.10 — the version the old floating `7-alpine` tag resolved to on
    # 2026-07-26 (confirmed with `redis-server --version` inside this digest).
    #
    # LICENCE, and the reason this is the most load-bearing pin in the file:
    # Redis relicensed AT 7.4. Up to 7.2 it was BSD-3-Clause; from 7.4 it is
    # dual Redis Source Available License v2 / Server Side Public License v1 —
    # source-available, NOT OSI open source (upstream LICENSE.txt at tag
    # 7.4.10). RSALv2's Limitations section forbids making "the functionality
    # of the Software ... available to third parties as a service".
    #
    # What that means for Firekeep concretely: fine as shipped, because the
    # customer self-hosts this for their own use. It would be fatal to a
    # HOSTED or managed Firekeep offering, where we would be the ones exposing
    # Redis functionality to third parties. If a hosted product is ever on the
    # table, re-examine this line first — before writing any code.
    #
    # The point of the pin: on `redis:7-alpine` that licence boundary was
    # crossed with no commit, no review, and nothing a reader of this repo
    # could have seen. A version bump here is a licensing decision.
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  ollama:
    # 0.32.4 — the version the old `latest` tag resolved to on 2026-07-26.
    # Licence: MIT (upstream LICENSE at tag v0.32.4). The image also carries an
    # Ubuntu 24.04 base and NVIDIA userspace libraries under their own terms.
    #
    # `latest` was the least defensible tag in this file: completely unpinned,
    # so the inference engine underneath every memory operation could change
    # between two installs of the same Firekeep version. It moves often —
    # 0.32.5 was already in release-candidate when this pin was taken.
    #
    # Keep this digest IDENTICAL to ollama-pull below; see the note there.
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8g
          # Configurable, and the default is deliberately LOW, because a cpus
          # limit behaves differently from a memory limit: Docker refuses to
          # CREATE a container whose cpus exceeds the host's core count
          # ("range of CPUs is from 0.01 to 2.00, as there are only 2 CPUs
          # available"), whereas a memory limit above host RAM is accepted as a
          # cap and merely over-subscribes. So a hard-coded 4.0 did not degrade
          # on a small host — it failed `docker compose up` outright, which is
          # how the stranger-install smoke test found it on a 2-core runner.
          #
          # 2.0 installs everywhere worth supporting. Raise it on a bigger box:
          # ollama is the inference engine under every memory operation, so more
          # cores here is the single most effective throughput knob.
          cpus: "${OLLAMA_CPUS:-2.0}"

  ollama-pull:
    # MUST stay byte-identical to the `ollama` service's image line above. This
    # init container is the same ollama build as the server it pulls models
    # into; letting the two drift means the client writing the model blobs and
    # the server reading them are different versions, which is exactly the
    # class of bug that presents as an unreproducible model-load failure.
    # Bump both together, or neither.
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull ${LLM_MODEL:-qwen3:4b} && \
        ollama pull ${EMBEDDING_MODEL:-mxbai-embed-large} && \
        echo "Models ready"
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  # ============================================================
  # FirekeepCortex — Long-term Memory
  # ============================================================

  cortex-api:
    image: ghcr.io/kapella-hub/firekeep-cortex:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: cortex/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.6.0}
        # Base-image registry. Personal deploys default to Docker Hub; the office
        # docker-host path pins its the registry mirror mirror in docker-compose.office.yml
        # (office CI builds bare `docker build`, which keeps the Dockerfile's own
        # mirror default). Without this passthrough the Dockerfile default made a
        # personal `update.sh` unbuildable off-lab (2026-07-18 VPS deploy failure).
        REGISTRY: ${REGISTRY:-docker.io/library}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # BIND_ADDR is the HOST interface every published app port binds to, and it
    # defaults to loopback: a default install is reachable only from the machine
    # it runs on. Set BIND_ADDR=0.0.0.0 in .env to serve remote clients — and
    # read the warning next to it in .env.example first, because a host firewall
    # will not save you: Docker publishes a port by writing its own iptables
    # DOCKER chain, which is evaluated BEFORE ufw's INPUT chain, so `ufw deny`
    # does not contain a published port. That is exactly how this stack's ports
    # stayed open to the internet behind an active ufw.
    #
    # The `--host 0.0.0.0` above is the IN-CONTAINER bind and must stay 0.0.0.0:
    # it is what lets the compose network — and therefore the mapping below —
    # reach uvicorn at all. Same for every MCP_HOST in this file.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8100:8000"
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      # Chat-endpoint selection (app/llm.py). `auto` probes {root}/api/version
      # once per process per TTL and uses ollama's native /api/chat when
      # confirmed — it honours think:false, which /v1 ignores (measured 4.00s
      # vs 83.19s on the same document). `never` disables it.
      LLM_NATIVE_CHAT: ${LLM_NATIVE_CHAT:-auto}
      LLM_NATIVE_PROBE_TTL_SECONDS: ${LLM_NATIVE_PROBE_TTL_SECONDS:-600.0}
      LLM_NATIVE_BASE_URL: ${LLM_NATIVE_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      # v2: Replay, Auth
      RP_REDIS_URL: redis://redis:6379/6
      # Auth is ON by default (all five services below carry the same default).
      # With it off every caller is anonymous, and an anonymous caller could
      # read GET /vault/secrets and mint keys via POST /auth/keys — that is how
      # 12 real secrets left this stack's own VPS. Safe to default on because
      # install.sh and update.sh both run deploy/bootstrap-keys.sh BEFORE the
      # app containers start, and that script writes Redis DB 7 directly with
      # redis-cli rather than POSTing to a now-401-gated /auth/keys, so it
      # cannot lock itself out. /health and /version are on the auth skip list,
      # so the installer's probes still pass. An existing .env that already
      # says AUTH_ENABLED=false keeps winning — compose interpolates from .env,
      # so this changes the default for NEW installs, not existing ones.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_REDIS_URL: redis://redis:6379/7
      # Enrollment invite defaults. The public endpoint never trusts these for
      # identity; they only let the admin dashboard render a reachable code.
      BIND_ADDR: ${BIND_ADDR:-127.0.0.1}
      VPS_IP: ${VPS_IP:-}
      FIREKEEP_SSH_USER: ${FIREKEEP_SSH_USER:-root}
      ENROLL_TICKET_TTL_HOURS: ${ENROLL_TICKET_TTL_HOURS:-24}
      ENROLL_TOMBSTONE_DAYS: ${ENROLL_TOMBSTONE_DAYS:-7}
      ENROLL_KEY_EXPIRES_DAYS: ${ENROLL_KEY_EXPIRES_DAYS:-90}
      ENROLL_RATE_LIMIT: ${ENROLL_RATE_LIMIT:-10/minute}
      ENROLL_MAX_ATTEMPTS_PER_HOUR: ${ENROLL_MAX_ATTEMPTS_PER_HOUR:-60}
      # Vault (encrypted secret storage, shares Redis DB 7 with auth)
      VAULT_ENABLED: ${VAULT_ENABLED:-true}
      VAULT_KEY: ${VAULT_KEY:-}
      VAULT_REDIS_URL: redis://redis:6379/7
      # Corpus (business knowledge graph)
      CORPUS_ENABLED: ${CORPUS_ENABLED:-true}
      # Knowledge Ingestion (docs -> skills orchestration, SP2)
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      KNOWLEDGE_MAX_PROCEDURES: ${KNOWLEDGE_MAX_PROCEDURES:-10}
      KNOWLEDGE_CLASSIFY_TIMEOUT_SECONDS: ${KNOWLEDGE_CLASSIFY_TIMEOUT_SECONDS:-300}
      # Tighter budget for the native endpoint, where think:false is honoured
      # (VPS: 4.00s; office llama3.2:3b: ~56s and unaffected by the fix, which
      # is the binding constraint on this number, not the VPS).
      KNOWLEDGE_CLASSIFY_NATIVE_TIMEOUT_SECONDS: ${KNOWLEDGE_CLASSIFY_NATIVE_TIMEOUT_SECONDS:-120.0}
      KNOWLEDGE_STATUS_TTL_SECONDS: ${KNOWLEDGE_STATUS_TTL_SECONDS:-2592000}
      # URL ingestion (SSRF-guarded crawler -> knowledge pipeline)
      KNOWLEDGE_URL_INGEST_ENABLED: ${KNOWLEDGE_URL_INGEST_ENABLED:-true}
      KNOWLEDGE_CRAWL_MAX_DEPTH: ${KNOWLEDGE_CRAWL_MAX_DEPTH:-2}
      KNOWLEDGE_CRAWL_MAX_PAGES: ${KNOWLEDGE_CRAWL_MAX_PAGES:-25}
      KNOWLEDGE_CRAWL_TIMEOUT_SECONDS: ${KNOWLEDGE_CRAWL_TIMEOUT_SECONDS:-15}
      KNOWLEDGE_CRAWL_MAX_PAGE_BYTES: ${KNOWLEDGE_CRAWL_MAX_PAGE_BYTES:-2000000}
      # Decision Board (SP4)
      DECISION_ENABLED: ${DECISION_ENABLED:-true}
      DECISION_SYNTH_TIMEOUT_SECONDS: ${DECISION_SYNTH_TIMEOUT_SECONDS:-20}
      DECISION_MAX_QUESTIONS: ${DECISION_MAX_QUESTIONS:-8}
      # Pattern validation (promotion ladder + A/B) — frozen until session volume (N=1)
      PATTERN_VALIDATION_ENABLED: ${PATTERN_VALIDATION_ENABLED:-false}
      # Policy Engine
      POLICY_DENY_PATHS: ${POLICY_DENY_PATHS:-.env,*.key,*.pem,*.secret}
      # Memory improvements — Phase 1-3
      EVICTION_THRESHOLD: ${EVICTION_THRESHOLD:-1.5}
      GC_ENABLED: ${GC_ENABLED:-true}
      GC_DRY_RUN: ${GC_DRY_RUN:-false}
      GC_ARCHIVE_GRACE_DAYS: ${GC_ARCHIVE_GRACE_DAYS:-90}
      GC_PURGE_ENABLED: ${GC_PURGE_ENABLED:-false}
      DEDUP_SIMILARITY_THRESHOLD: ${DEDUP_SIMILARITY_THRESHOLD:-0.78}
      DEDUP_ENABLED: ${DEDUP_ENABLED:-false}
      RECALL_TOKEN_BUDGET: ${RECALL_TOKEN_BUDGET:-600}
      RECALL_TOP_K: ${RECALL_TOP_K:-3}
      RECALL_SYNTHESIS_ENABLED: ${RECALL_SYNTHESIS_ENABLED:-false}
      RECALL_SCORE_FLOOR: ${RECALL_SCORE_FLOOR:-0.35}
      # Outcome-Weighted Memory (recall ranking term)
      OWM_ENABLED: ${OWM_ENABLED:-true}
      OWM_WEIGHT: ${OWM_WEIGHT:-0.15}
      # SP0 memory reliability
      EMBED_RETRY_ATTEMPTS: ${EMBED_RETRY_ATTEMPTS:-3}
      BACKFILL_MAX_ATTEMPTS: ${BACKFILL_MAX_ATTEMPTS:-10}
      # Skill Synthesis
      BRIDGE_URL: ${BRIDGE_URL:-http://bridge:8070}
      # SP1b: briefing aggregator upstreams (Relay tasks/bulletins, Sentinel env)
      RELAY_URL: ${RELAY_URL:-http://relay:8050}
      SENTINEL_URL: ${SENTINEL_URL:-http://sentinel:8060}
      SKILL_SYNTHESIS_ENABLED: ${SKILL_SYNTHESIS_ENABLED:-false}
      SKILL_SCORE_THRESHOLD: ${SKILL_SCORE_THRESHOLD:-0.6}
      SKILL_STALE_AFTER_DAYS: ${SKILL_STALE_AFTER_DAYS:-90}
      # Raw-cosine floor for semantic skill matching (GET /skills?q=, briefing skills
      # section). NOT RECALL_SCORE_FLOOR — skills embed a terse composite, and the
      # office deploy uses a different embedding model/dim. Most likely knob to tune.
      SKILL_MATCH_SCORE_FLOOR: ${SKILL_MATCH_SCORE_FLOOR:-0.30}
      SKILL_MATCH_EMBED_TIMEOUT_SECONDS: ${SKILL_MATCH_EMBED_TIMEOUT_SECONDS:-1.2}
      SKILL_ERROR_DENSITY_WEIGHT: ${SKILL_ERROR_DENSITY_WEIGHT:-0.30}
      SKILL_ANOMALY_WEIGHT: ${SKILL_ANOMALY_WEIGHT:-0.20}
      SKILL_RESOLUTION_WEIGHT: ${SKILL_RESOLUTION_WEIGHT:-0.35}
      SKILL_AGENT_SCHEDULE_HOURS: ${SKILL_AGENT_SCHEDULE_HOURS:-6}
      SKILL_SYNTH_TIMEOUT_SECONDS: ${SKILL_SYNTH_TIMEOUT_SECONDS:-300.0}
      SKILL_SYNTH_MAX_TOKENS: ${SKILL_SYNTH_MAX_TOKENS:-800}
      # Team continuity — agent identity
      FIREKEEP_AGENT_ID: "${FIREKEEP_AGENT_ID:-firekeep-server}"
      # Agent Gateway
      AGENT_GATEWAY_ENABLED: ${AGENT_GATEWAY_ENABLED:-true}
      AGENT_PREDICTION_CONFIDENCE_THRESHOLD: ${AGENT_PREDICTION_CONFIDENCE_THRESHOLD:-0.6}
      AGENT_RECONCILE_DEADLINE_SECONDS: ${AGENT_RECONCILE_DEADLINE_SECONDS:-300}
      AGENT_RETHINK_MAX_LOOPS: ${AGENT_RETHINK_MAX_LOOPS:-3}
      AGENT_FASTPATH_MIN_SAMPLES: ${AGENT_FASTPATH_MIN_SAMPLES:-20}
      AGENT_FASTPATH_MIN_SUCCESS_RATE: ${AGENT_FASTPATH_MIN_SUCCESS_RATE:-0.9}
      AGENT_FASTPATH_CACHE_TTL_SECONDS: ${AGENT_FASTPATH_CACHE_TTL_SECONDS:-86400}
      # Collectors (SP3) — Confluence
      COLLECTORS_ENABLED: ${COLLECTORS_ENABLED:-false}
      CONFLUENCE_COLLECTOR_ENABLED: ${CONFLUENCE_COLLECTOR_ENABLED:-false}
      CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-}
      CONFLUENCE_SPACE_KEYS: ${CONFLUENCE_SPACE_KEYS:-}
      CONFLUENCE_LABEL: ${CONFLUENCE_LABEL:-}
      CONFLUENCE_PAT_VAULT_KEY: ${CONFLUENCE_PAT_VAULT_KEY:-confluence_pat}
      CONFLUENCE_PAT: ${CONFLUENCE_PAT:-}
      CONFLUENCE_COLLECTOR_SCHEDULE_HOURS: ${CONFLUENCE_COLLECTOR_SCHEDULE_HOURS:-24}
      COLLECTOR_LOCK_TTL_SECONDS: ${COLLECTOR_LOCK_TTL_SECONDS:-3600}
      # Dreaming (app/dreams/) — automated consolidation + person profiles.
      # Round 1 is additive-only (nothing is archived); off by default. Only
      # DREAM_ENABLED actually gates anything here (the GET /dreams router
      # mount) — the rest are passed for parity with worker/beat, mirroring
      # the Collectors precedent above.
      DREAM_ENABLED: ${DREAM_ENABLED:-false}
      DREAM_TICK_MINUTES: ${DREAM_TICK_MINUTES:-5}
      DREAM_IDLE_MINUTES: ${DREAM_IDLE_MINUTES:-30}
      DREAM_MIN_NEW_MEMORIES: ${DREAM_MIN_NEW_MEMORIES:-25}
      DREAM_MIN_AGE_DAYS: ${DREAM_MIN_AGE_DAYS:-2}
      DREAM_MIN_CLUSTER: ${DREAM_MIN_CLUSTER:-4}
      DREAM_CLUSTER_THRESHOLD: ${DREAM_CLUSTER_THRESHOLD:-0.72}
      DREAM_MAX_CLUSTERS_PER_RUN: ${DREAM_MAX_CLUSTERS_PER_RUN:-20}
      DREAM_MAX_INSIGHT_CHARS: ${DREAM_MAX_INSIGHT_CHARS:-800}
      DREAM_OWM_FLOOR: ${DREAM_OWM_FLOOR:-0.35}
      DREAM_SYNTH_TIMEOUT_SECONDS: ${DREAM_SYNTH_TIMEOUT_SECONDS:-45.0}
      DREAM_LOCK_TTL_SECONDS: ${DREAM_LOCK_TTL_SECONDS:-1800}
      DREAM_PROFILES_ENABLED: ${DREAM_PROFILES_ENABLED:-true}
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  cortex-mcp:
    image: ghcr.io/kapella-hub/firekeep-cortex:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: cortex/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.6.0}
        # Base-image registry. Personal deploys default to Docker Hub; the office
        # docker-host path pins its the registry mirror mirror in docker-compose.office.yml
        # (office CI builds bare `docker build`, which keeps the Dockerfile's own
        # mirror default). Without this passthrough the Dockerfile default made a
        # personal `update.sh` unbuildable off-lab (2026-07-18 VPS deploy failure).
        REGISTRY: ${REGISTRY:-docker.io/library}
    restart: unless-stopped
    command: python -m app.mcp_server
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      FIREKEEP_API_URL: http://cortex-api:8000
      # SP1a: cortex-mcp holds NO key of its own — it forwards the CALLER's
      # X-API-Key (confused-deputy fix, cortex/app/mcp_server.py _get_client).
      # Pinned empty so a stale .env value cannot resurrect the old behavior.
      FIREKEEP_API_KEY: ""
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_REDIS_URL: redis://redis:6379/7
      # SP1b: briefing aggregator upstreams (Relay tasks/bulletins, Sentinel env)
      RELAY_URL: ${RELAY_URL:-http://relay:8050}
      SENTINEL_URL: ${SENTINEL_URL:-http://sentinel:8060}
      # Knowledge Ingestion (docs -> skills orchestration, SP2)
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      KNOWLEDGE_MAX_PROCEDURES: ${KNOWLEDGE_MAX_PROCEDURES:-10}
      KNOWLEDGE_CLASSIFY_TIMEOUT_SECONDS: ${KNOWLEDGE_CLASSIFY_TIMEOUT_SECONDS:-300}
      # Tighter budget for the native endpoint, where think:false is honoured
      # (VPS: 4.00s; office llama3.2:3b: ~56s and unaffected by the fix, which
      # is the binding constraint on this number, not the VPS).
      KNOWLEDGE_CLASSIFY_NATIVE_TIMEOUT_SECONDS: ${KNOWLEDGE_CLASSIFY_NATIVE_TIMEOUT_SECONDS:-120.0}
      KNOWLEDGE_STATUS_TTL_SECONDS: ${KNOWLEDGE_STATUS_TTL_SECONDS:-2592000}
      # Decision Board (SP4)
      DECISION_ENABLED: ${DECISION_ENABLED:-true}
      DECISION_SYNTH_TIMEOUT_SECONDS: ${DECISION_SYNTH_TIMEOUT_SECONDS:-20}
      DECISION_MAX_QUESTIONS: ${DECISION_MAX_QUESTIONS:-8}
    env_file:
      - .env
    depends_on:
      cortex-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  cortex-worker:
    image: ghcr.io/kapella-hub/firekeep-cortex:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: cortex/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.6.0}
        REGISTRY: ${REGISTRY:-docker.io/library}
    restart: unless-stopped
    command: celery -A app.workers.sleep_cycle worker --loglevel=info --concurrency=1 --pool=solo
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      # Chat-endpoint selection — see the cortex-api block above. The worker is
      # where classify and skill drafting actually run, so this is the service
      # the 20x saving lands on.
      LLM_NATIVE_CHAT: ${LLM_NATIVE_CHAT:-auto}
      LLM_NATIVE_PROBE_TTL_SECONDS: ${LLM_NATIVE_PROBE_TTL_SECONDS:-600.0}
      LLM_NATIVE_BASE_URL: ${LLM_NATIVE_BASE_URL:-}
      # Team continuity — agent identity
      FIREKEEP_AGENT_ID: "${FIREKEEP_AGENT_ID:-firekeep-server}"
      # Vault (encrypted secret storage, shares Redis DB 7 with auth) — needed
      # by the collector's _bootstrap_vault_and_pat (new vault consumer, SP3)
      VAULT_ENABLED: ${VAULT_ENABLED:-true}
      VAULT_KEY: ${VAULT_KEY:-}
      VAULT_REDIS_URL: redis://redis:6379/7
      # Memory improvements — GC + dedup
      EVICTION_THRESHOLD: ${EVICTION_THRESHOLD:-1.5}
      GC_ENABLED: ${GC_ENABLED:-true}
      GC_DRY_RUN: ${GC_DRY_RUN:-false}
      GC_ARCHIVE_GRACE_DAYS: ${GC_ARCHIVE_GRACE_DAYS:-90}
      GC_PURGE_ENABLED: ${GC_PURGE_ENABLED:-false}
      DEDUP_SIMILARITY_THRESHOLD: ${DEDUP_SIMILARITY_THRESHOLD:-0.78}
      DEDUP_ENABLED: ${DEDUP_ENABLED:-false}
      EMBED_RETRY_ATTEMPTS: ${EMBED_RETRY_ATTEMPTS:-3}
      BACKFILL_MAX_ATTEMPTS: ${BACKFILL_MAX_ATTEMPTS:-10}
      # Skill Synthesis
      BRIDGE_URL: ${BRIDGE_URL:-http://bridge:8070}
      SKILL_SYNTHESIS_ENABLED: ${SKILL_SYNTHESIS_ENABLED:-false}
      SKILL_SCORE_THRESHOLD: ${SKILL_SCORE_THRESHOLD:-0.6}
      SKILL_STALE_AFTER_DAYS: ${SKILL_STALE_AFTER_DAYS:-90}
      # Raw-cosine floor for semantic skill matching (GET /skills?q=, briefing skills
      # section). NOT RECALL_SCORE_FLOOR — skills embed a terse composite, and the
      # office deploy uses a different embedding model/dim. Most likely knob to tune.
      SKILL_MATCH_SCORE_FLOOR: ${SKILL_MATCH_SCORE_FLOOR:-0.30}
      SKILL_MATCH_EMBED_TIMEOUT_SECONDS: ${SKILL_MATCH_EMBED_TIMEOUT_SECONDS:-1.2}
      SKILL_ERROR_DENSITY_WEIGHT: ${SKILL_ERROR_DENSITY_WEIGHT:-0.30}
      SKILL_ANOMALY_WEIGHT: ${SKILL_ANOMALY_WEIGHT:-0.20}
      SKILL_RESOLUTION_WEIGHT: ${SKILL_RESOLUTION_WEIGHT:-0.35}
      SKILL_AGENT_SCHEDULE_HOURS: ${SKILL_AGENT_SCHEDULE_HOURS:-6}
      SKILL_SYNTH_TIMEOUT_SECONDS: ${SKILL_SYNTH_TIMEOUT_SECONDS:-300.0}
      SKILL_SYNTH_MAX_TOKENS: ${SKILL_SYNTH_MAX_TOKENS:-800}
      # Pattern validation (promotion ladder + A/B) — frozen until session volume (N=1);
      # cortex-worker runs promote_all_patterns, so it must read the same flag.
      PATTERN_VALIDATION_ENABLED: ${PATTERN_VALIDATION_ENABLED:-false}
      # URL ingestion (SSRF-guarded crawler -> knowledge pipeline) — run_url_ingest
      # (Celery, this worker) does the actual crawl + per-page ingest.
      KNOWLEDGE_URL_INGEST_ENABLED: ${KNOWLEDGE_URL_INGEST_ENABLED:-true}
      KNOWLEDGE_CRAWL_MAX_DEPTH: ${KNOWLEDGE_CRAWL_MAX_DEPTH:-2}
      KNOWLEDGE_CRAWL_MAX_PAGES: ${KNOWLEDGE_CRAWL_MAX_PAGES:-25}
      KNOWLEDGE_CRAWL_TIMEOUT_SECONDS: ${KNOWLEDGE_CRAWL_TIMEOUT_SECONDS:-15}
      KNOWLEDGE_CRAWL_MAX_PAGE_BYTES: ${KNOWLEDGE_CRAWL_MAX_PAGE_BYTES:-2000000}
      # Collectors (SP3) — Confluence
      COLLECTORS_ENABLED: ${COLLECTORS_ENABLED:-false}
      CONFLUENCE_COLLECTOR_ENABLED: ${CONFLUENCE_COLLECTOR_ENABLED:-false}
      CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-}
      CONFLUENCE_SPACE_KEYS: ${CONFLUENCE_SPACE_KEYS:-}
      CONFLUENCE_LABEL: ${CONFLUENCE_LABEL:-}
      CONFLUENCE_PAT_VAULT_KEY: ${CONFLUENCE_PAT_VAULT_KEY:-confluence_pat}
      CONFLUENCE_PAT: ${CONFLUENCE_PAT:-}
      CONFLUENCE_COLLECTOR_SCHEDULE_HOURS: ${CONFLUENCE_COLLECTOR_SCHEDULE_HOURS:-24}
      # Outcome-Weighted Memory (nightly scoring pass)
      OWM_ENABLED: ${OWM_ENABLED:-true}
      OWM_PRIOR_N: ${OWM_PRIOR_N:-5}
      OWM_WINDOW_DAYS: ${OWM_WINDOW_DAYS:-30}
      OWM_AGENT_CAP: ${OWM_AGENT_CAP:-5}
      OWM_SCHEDULE_HOURS: ${OWM_SCHEDULE_HOURS:-24}
      # OWM reads replay/eval data from DB 6 — pinned inline like cortex-api
      # (an older .env without RP_REDIS_URL would otherwise point at localhost)
      RP_REDIS_URL: redis://redis:6379/6
      COLLECTOR_LOCK_TTL_SECONDS: ${COLLECTOR_LOCK_TTL_SECONDS:-3600}
      # Dreaming (app/dreams/) — this is the worker that actually runs
      # run_dream_tick (app/dreams/task.py), so every DREAM_* setting binds
      # here. Round 1 is additive-only (nothing is archived); off by default.
      DREAM_ENABLED: ${DREAM_ENABLED:-false}
      DREAM_TICK_MINUTES: ${DREAM_TICK_MINUTES:-5}
      DREAM_IDLE_MINUTES: ${DREAM_IDLE_MINUTES:-30}
      DREAM_MIN_NEW_MEMORIES: ${DREAM_MIN_NEW_MEMORIES:-25}
      DREAM_MIN_AGE_DAYS: ${DREAM_MIN_AGE_DAYS:-2}
      DREAM_MIN_CLUSTER: ${DREAM_MIN_CLUSTER:-4}
      DREAM_CLUSTER_THRESHOLD: ${DREAM_CLUSTER_THRESHOLD:-0.72}
      DREAM_MAX_CLUSTERS_PER_RUN: ${DREAM_MAX_CLUSTERS_PER_RUN:-20}
      DREAM_MAX_INSIGHT_CHARS: ${DREAM_MAX_INSIGHT_CHARS:-800}
      DREAM_OWM_FLOOR: ${DREAM_OWM_FLOOR:-0.35}
      DREAM_SYNTH_TIMEOUT_SECONDS: ${DREAM_SYNTH_TIMEOUT_SECONDS:-45.0}
      DREAM_LOCK_TTL_SECONDS: ${DREAM_LOCK_TTL_SECONDS:-1800}
      DREAM_PROFILES_ENABLED: ${DREAM_PROFILES_ENABLED:-true}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.sleep_cycle inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  cortex-beat:
    image: ghcr.io/kapella-hub/firekeep-cortex:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: cortex/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.6.0}
        # Base-image registry. Personal deploys default to Docker Hub; the office
        # docker-host path pins its the registry mirror mirror in docker-compose.office.yml
        # (office CI builds bare `docker build`, which keeps the Dockerfile's own
        # mirror default). Without this passthrough the Dockerfile default made a
        # personal `update.sh` unbuildable off-lab (2026-07-18 VPS deploy failure).
        REGISTRY: ${REGISTRY:-docker.io/library}
    restart: unless-stopped
    command: celery -A app.workers.sleep_cycle beat --loglevel=info
    environment:
      # Collectors (SP3) — Confluence (beat needs the schedule-hours value to
      # build beat_schedule at startup; the rest mirror worker/api for parity)
      COLLECTORS_ENABLED: ${COLLECTORS_ENABLED:-false}
      CONFLUENCE_COLLECTOR_ENABLED: ${CONFLUENCE_COLLECTOR_ENABLED:-false}
      CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-}
      CONFLUENCE_SPACE_KEYS: ${CONFLUENCE_SPACE_KEYS:-}
      CONFLUENCE_LABEL: ${CONFLUENCE_LABEL:-}
      CONFLUENCE_PAT_VAULT_KEY: ${CONFLUENCE_PAT_VAULT_KEY:-confluence_pat}
      CONFLUENCE_PAT: ${CONFLUENCE_PAT:-}
      CONFLUENCE_COLLECTOR_SCHEDULE_HOURS: ${CONFLUENCE_COLLECTOR_SCHEDULE_HOURS:-24}
      OWM_SCHEDULE_HOURS: ${OWM_SCHEDULE_HOURS:-24}
      COLLECTOR_LOCK_TTL_SECONDS: ${COLLECTOR_LOCK_TTL_SECONDS:-3600}
      # Dreaming (app/dreams/) — beat needs DREAM_TICK_MINUTES at startup to
      # build the "dream-tick" beat_schedule entry; the rest mirror
      # worker/api for parity, same as the Collectors block above. Round 1
      # is additive-only (nothing is archived); off by default.
      DREAM_ENABLED: ${DREAM_ENABLED:-false}
      DREAM_TICK_MINUTES: ${DREAM_TICK_MINUTES:-5}
      DREAM_IDLE_MINUTES: ${DREAM_IDLE_MINUTES:-30}
      DREAM_MIN_NEW_MEMORIES: ${DREAM_MIN_NEW_MEMORIES:-25}
      DREAM_MIN_AGE_DAYS: ${DREAM_MIN_AGE_DAYS:-2}
      DREAM_MIN_CLUSTER: ${DREAM_MIN_CLUSTER:-4}
      DREAM_CLUSTER_THRESHOLD: ${DREAM_CLUSTER_THRESHOLD:-0.72}
      DREAM_MAX_CLUSTERS_PER_RUN: ${DREAM_MAX_CLUSTERS_PER_RUN:-20}
      DREAM_MAX_INSIGHT_CHARS: ${DREAM_MAX_INSIGHT_CHARS:-800}
      DREAM_OWM_FLOOR: ${DREAM_OWM_FLOOR:-0.35}
      DREAM_SYNTH_TIMEOUT_SECONDS: ${DREAM_SYNTH_TIMEOUT_SECONDS:-45.0}
      DREAM_LOCK_TTL_SECONDS: ${DREAM_LOCK_TTL_SECONDS:-1800}
      DREAM_PROFILES_ENABLED: ${DREAM_PROFILES_ENABLED:-true}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          # Was 128m, and the stranger-install smoke test measured this container
          # at 116.9 MiB against it — 91% of its cap, one load spike from an OOM
          # kill whose failure mode is SILENT: beat dies, scheduled tasks simply
          # stop firing, and nothing reports it. 256m restores real headroom and
          # matches the house size for the other small services (cortex-mcp,
          # bridge, sentinel, relay are all 256m).
          memory: 256m
          cpus: "0.1"

  # ============================================================
  # FirekeepBridge — Session Context
  # ============================================================

  bridge:
    image: ghcr.io/kapella-hub/firekeep-bridge:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: bridge/Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.6.0}
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8070:8070"
    environment:
      NB_REDIS_URL: redis://redis:6379/3
      NB_MCP_HOST: "0.0.0.0"
      NB_MCP_PORT: "8070"
      NB_FIREKEEP_API_URL: http://cortex-api:8000
      # SP1a: internal service key (minted by deploy/bootstrap-keys.sh;
      # scopes memory:write/session:read/eval:read/eval:write — NOT admin)
      NB_FIREKEEP_API_KEY: ${FIREKEEP_INTERNAL_KEY:-}
      NB_FIREKEEP_NAMESPACE: ${NB_FIREKEEP_NAMESPACE:-default}
      RP_REDIS_URL: redis://redis:6379/6
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_REDIS_URL: redis://redis:6379/7
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8070'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ============================================================
  # FirekeepSentinel — Environment Observer
  # ============================================================

  sentinel:
    image: ghcr.io/kapella-hub/firekeep-sentinel:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: sentinel/Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.6.0}
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8060:8060"
    environment:
      NS_REDIS_URL: redis://redis:6379/4
      NS_MCP_HOST: "0.0.0.0"
      NS_MCP_PORT: "8060"
      # SP1b §11: internal service key for Sentinel's outbound calls
      # (alert broadcast -> Relay, webhook fire -> Cortex) under office
      # AUTH_ENABLED=true. Unset on personal VPS -> calls unchanged.
      NS_FIREKEEP_INTERNAL_KEY: ${FIREKEEP_INTERNAL_KEY:-}
      NS_CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      RP_REDIS_URL: redis://redis:6379/6
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_REDIS_URL: redis://redis:6379/7
    env_file:
      - .env
    # Both former mounts are removed from the default install. Neither did
    # anything out of the box, and each was a serious grant:
    #
    #   /var/run/docker.sock  -- host-root-equivalent. A process that can reach
    #     the Docker API can create a container with a host bind mount. There is
    #     no read-only form: `:ro` restricts the socket file, not the API. The
    #     docker collector is now default-off (NS_DOCKER_COLLECTOR_ENABLED), so
    #     nothing here opens it. To opt in, set that flag AND restore:
    #         - /var/run/docker.sock:/var/run/docker.sock
    #     Prefer fronting it with a read-only socket proxy exposing only
    #     GET /containers/json, which is the single call the collector makes.
    #
    #   ./:/watch:ro  -- mounted the ENTIRE repository into this container,
    #     including .env, which holds NEO4J_PASSWORD, VAULT_KEY and the minted
    #     API keys. The git and file collectors read their watch list from Redis
    #     (WATCHES_KEY) and NS_WATCH_PATHS, both empty by default, so this
    #     mount was never read. To watch a tree, mount just that tree:
    #         - /srv/my-project:/watch/my-project:ro
    #     and set NS_WATCH_PATHS=/watch/my-project.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8060'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ============================================================
  # FirekeepRelay — Agent Communication
  # ============================================================

  relay:
    image: ghcr.io/kapella-hub/firekeep-relay:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: relay/Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.6.0}
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8050:8050"
    environment:
      NR_REDIS_URL: redis://redis:6379/5
      NR_MCP_HOST: "0.0.0.0"
      NR_MCP_PORT: "8050"
      NR_CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      NR_BRIDGE_URL: ${BRIDGE_URL:-http://bridge:8070}
      # SP2: outbound key for Relay->Bridge decision writes (origin:"mcp"
      # scope sessions). Minted by deploy/bootstrap-keys.sh with exactly
      # ["session:write"] — the gap this comment used to describe (manual
      # provisioning only) closed when auth became the default, because it
      # would otherwise have bitten every FRESH install rather than just an
      # office one. Do not hand-mint with `firekeep-admin keys create`: that
      # grants the full non-admin scope set to a single internal write path.
      # Unset means only NexusScope origin:"mcp" writes 401; the rest of the
      # stack is unaffected.
      NR_FIREKEEP_API_KEY: ${RELAY_INTERNAL_API_KEY:-}
      RP_REDIS_URL: redis://redis:6379/6
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_REDIS_URL: redis://redis:6379/7
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8050'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ============================================================
  # Dashboard — Unified Web UI
  # ============================================================

  dashboard:
    # 1.31.3 — the version the old floating `alpine` tag resolved to on
    # 2026-07-26 (confirmed with `nginx -v` inside this digest). Licence:
    # BSD-2-Clause, recorded as "2-clause BSD-like license" in the apk package
    # database inside the image itself.
    #
    # Worth knowing before bumping: `nginx:alpine` follows the MAINLINE branch,
    # so that tag moved across FEATURE releases, not just patches — it could
    # change nginx behaviour under the dashboard's proxy config (see
    # dashboard/nginx.conf.template) without any change here.
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8040:80"
    environment:
      # Dedicated admin-scoped key injected as X-API-Key on all /api/ proxies.
      # Minted into .env by deploy/bootstrap-keys.sh, which install.sh and
      # update.sh both run before the app containers start. Now that
      # AUTH_ENABLED defaults to true this key is LOAD-BEARING, not optional:
      # empty means nginx sends no header at all (it drops empty
      # proxy_set_header values) and every dashboard data tab 401s. If that
      # happens, re-run `bash deploy/bootstrap-keys.sh` and recreate this
      # container — the value is read at container start, not per request.
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      # Template rendered by the nginx image entrypoint (envsubst on
      # /etc/nginx/templates/*.template -> /etc/nginx/conf.d/default.conf,
      # substituting ONLY defined container env vars).
      - ./dashboard/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./dashboard/.htpasswd:/etc/nginx/.htpasswd:ro
      # NOTE: every mount above is a SINGLE FILE, and docker resolves a
      # single-file bind mount to an INODE at container start. Editing such a
      # file in place (`>`, sed -i without --follow-symlinks caveats) is seen by
      # the container; REPLACING it (cp+mv, editors that write-then-rename)
      # silently is not — the container keeps serving the old inode while the
      # host shows the new content. Recreate the container after any replace.
      # Found the hard way rotating .htpasswd: the host had the new user, the
      # container still authenticated the old one, and every credential 401'd.
      #
      # Brand assets are a DIRECTORY mount, so new files appear without a
      # compose change. This is deliberately not covered by
      # docker/Dockerfile.dashboard's `COPY dashboard/brand/` — that image is
      # the k8s/CI path; compose runs stock nginx and never builds it. Both
      # paths need the assets, and they need them by different mechanisms.
      - ./dashboard/brand:/usr/share/nginx/html/brand:ro
    depends_on:
      cortex-api:
        condition: service_healthy
      bridge:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      relay:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"

volumes:
  neo4j_data:
  qdrant_data:
  redis_data:
  ollama_data:
