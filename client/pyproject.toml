[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firekeep-client"
version = "0.1.36"
description = "Firekeep portable client kit: stdio-proxy shim, hook cores, sidecar, and runtime adapters."
requires-python = ">=3.10"
license = "LicenseRef-Firekeep-BUSL-1.1"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27,<1",
    "truststore>=0.9.1",
]

[project.scripts]
firekeep = "firekeep_client.cli:main"
firekeep-shim = "firekeep_client.shim:main"
firekeep-sidecar = "firekeep_client.sidecar:main"
firekeep-decision = "firekeep_client.decision.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["firekeep_client*"]

[tool.pytest.ini_options]
markers = ["e2e: real network install (excluded from the default run)"]
addopts = "-m 'not e2e'"
