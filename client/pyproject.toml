[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firekeep-client"
version = "0.1.48"
description = "Firekeep portable client kit: stdio-proxy shim, hook cores, sidecar, and runtime adapters."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Firekeep-BUSL-1.1"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "model-context-protocol", "ai-agents", "agent-memory", "claude-code", "codex", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27,<1",
    "truststore>=0.9.1",
]

# The managed bootstrap always installs the firekeep-symdex wheel side by side
# (whether the dex registry then MOUNTS it is a separate question — see
# firekeep_client/dexes.py). For pip installs it is an extra, NOT a hard
# dependency: the gateway degrades gracefully without it, and forcing
# tree-sitter's binary grammars on every pip consumer would fight the
# resolution philosophy that keeps this package deliberately unlocked
# (tests/test_requirements_lock.py). firekeep-docdex is deliberately NOT an
# extra here — it depends on firekeep-client, so an extra would be a cycle;
# pip users install it directly.
[project.optional-dependencies]
symdex = ["firekeep-symdex>=0.2,<1"]

[project.urls]
Homepage = "https://firekeep.ai"
Documentation = "https://firekeep.ai/docs.html"
Changelog = "https://kapella-hub.github.io/firekeep-dist/latest/latest.json"

[project.scripts]
firekeep = "firekeep_client.cli:main"
firekeep-shim = "firekeep_client.shim:main"
firekeep-sidecar = "firekeep_client.sidecar:main"
firekeep-decision = "firekeep_client.decision.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["firekeep_client*"]

[tool.pytest.ini_options]
markers = ["e2e: real network install (excluded from the default run)"]
addopts = "-m 'not e2e'"
