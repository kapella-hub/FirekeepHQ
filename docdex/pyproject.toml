[project]
name = "firekeep-docdex"
version = "0.2.1"
description = "Firekeep docdex: the documents dex — folders of documents indexed into the Keep's corpus"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Firekeep-BUSL-1.1"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "ai-agents", "agent-memory", "documents", "rag", "knowledge-base", "markdown", "obsidian", "pdf", "html", "email", "chatgpt-export", "claude-code", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # resolver (endpoint + auth headers + the bypass gate) and transport. Docdex
    # never builds a URL or an auth header of its own. The floor is 1.0.0 —
    # docdex's imports would run against 0.1.48, but the `firekeep docdex`
    # bridge, the dex registry and the doctor rows only exist from 1.0.0, and a
    # pip pairing below that floor is a confusing half-experience, not a
    # supported one.
    "firekeep-client>=1.0.0,<2",
    "pypdf>=4,<7",
    "python-docx>=1,<2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
firekeep-docdex = "firekeep_docdex.cli:main"

[project.urls]
Homepage = "https://firekeep.ai"
Documentation = "https://firekeep.ai/docs.html"
Changelog = "https://kapella-hub.github.io/firekeep-dist/latest/latest.json"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firekeep_docdex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
