[project]
name = "firekeep-docdex"
version = "0.1.0"
description = "Firekeep docdex: the documents dex — folders of documents indexed into the Keep's corpus"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Firekeep-BUSL-1.1"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    # resolver (endpoint + auth headers + the bypass gate) and transport. Docdex
    # never builds a URL or an auth header of its own.
    "firekeep-client>=0.1.48",
    "pypdf>=4,<7",
    "python-docx>=1,<2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
firekeep-docdex = "firekeep_docdex.cli:main"

[project.urls]
Homepage = "https://firekeep.ai"
Documentation = "https://firekeep.ai/docs.html"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firekeep_docdex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
