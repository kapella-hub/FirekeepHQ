<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Firekeep">
  <title>Firekeep</title>
  <!--
    currentColor variant of the Vault mark, for SVG that is INLINED into the
    DOM: one file serves ember, mono and grey by taking the surrounding
    `color`. The dark coin from mark-ember.svg is deliberately absent — a
    single-colour glyph cannot carry a two-tone coin, so inline contexts get
    the padlock itself, larger in the box.

    NO <mask> here, deliberately: masks need ids, and ids collide when a file
    is inlined twice on one page. The flame is an evenodd subpath nested in
    the body instead; the shackle is a plain stroke. Nothing to collide.

    Remember: currentColor does not survive <img>/background-image/<link>.
    Loaded standalone this renders BLACK. Use mark-ember.svg there.
  -->
  <path fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" d="M17 32 V24 A15 15 0 0 1 47 24 V32"/>
  <path fill="currentColor" fill-rule="evenodd" d="
    M18 30 H46 A8 8 0 0 1 54 38 V50 A8 8 0 0 1 46 58 H18 A8 8 0 0 1 10 50 V38 A8 8 0 0 1 18 30 Z
    M34.18 34.65C34.70 38.91 38.44 40.82 38.44 45.69C38.44 50.13 35.57 53.35 31.92 53.35C28.18 53.35 25.57 50.65 25.57 46.91C25.57 43.69 27.91 41.78 28.96 39.08C29.39 41.69 30.52 42.82 31.57 43.35C30.96 39.95 32.00 37.17 34.18 34.65Z"/>
</svg>
