<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Firekeep">
  <title>Firekeep</title>
  <!--
    Direction A + "Core" flame. ONE path, three subpaths, fill-rule="evenodd":
      1. the keep      (rounded square)  -> filled
      2. the flame     (crossing 2)      -> knocked out
      3. the ember     (crossing 3)      -> stands again as an island

    evenodd is used deliberately instead of <mask>: a mask needs an id, and ids
    collide the moment two of these are inlined on one page. This file can be
    dropped anywhere, any number of times, with no id namespace at all.

    Colour comes from `currentColor`, so one file serves ember, mono and grey.
  -->
