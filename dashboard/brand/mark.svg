<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Firekeep">
  <title>Firekeep</title>
  <!--
    currentColor variant of the Beacon, for SVG that is INLINED into the DOM:
    one file serves ember, mono and grey by taking the surrounding `color`.
    The flame's gradient from mark-ember.svg is deliberately absent — a
    single-colour glyph cannot carry a ramp — and the flame keeps its inner
    ember cut instead (evenodd), which is what gives the one-colour mark its
    detail. The flame/bowl gap does the separating that colour cannot.

    NO ids of any kind (no mask, no gradient): ids collide when a file is
    inlined twice on one page. Everything here is plain paths.

    Remember: currentColor does not survive <img>/background-image/<link>.
    Loaded standalone this renders BLACK. Use mark-ember.svg there.
  -->
  <path d="M14 40 A18 18 0 0 0 50 40 Z" fill="currentColor"/>
  <rect x="29" y="54" width="6" height="4" rx="2" fill="currentColor"/>
  <g transform="translate(17.90 10.77) scale(0.92)">
    <path fill="currentColor" fill-rule="evenodd" d="
      M17.61 5.58C18.13 9.84 21.87 11.75 21.87 16.62C21.87 21.06 19.00 24.28 15.35 24.28C11.61 24.28 9.00 21.58 9.00 17.84C9.00 14.62 11.34 12.71 12.39 10.01C12.82 12.62 13.95 13.75 15.00 14.28C14.39 10.88 15.43 8.10 17.61 5.58Z
      M16.30 14.54C16.65 16.71 18.48 17.76 18.48 19.67C18.48 21.41 17.17 22.63 15.43 22.63C13.69 22.63 12.39 21.50 12.39 19.93C12.39 18.63 13.26 17.84 13.95 16.62C14.13 17.76 14.56 18.28 15.09 18.54C14.82 17.15 15.26 15.93 16.30 14.54Z"/>
  </g>
</svg>
