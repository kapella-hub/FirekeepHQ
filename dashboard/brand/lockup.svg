<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 32" width="152" height="32" role="img" aria-label="Firekeep">
  <title>Firekeep</title>
  <!--
    Horizontal lockup: mark + wordmark. Clearspace on every side is half the
    mark's height (16 units) — do not crowd it.

    The mark is the currentColor Vault glyph (mark.svg's geometry at half
    scale — coinless, maskless, id-free; see mark.svg for both whys).

    The wordmark uses LIVE TEXT, not outlines, so it needs DM Sans present.
    On a page that self-hosts DM Sans (the dashboard does; the website should)
    this renders correctly. Where the font cannot be guaranteed, compose the
    lockup in HTML instead — mark.svg + a styled <span> — rather than shipping
    this file and hoping. Outlining the wordmark needs a font toolchain and is
    deliberately not faked here.
  -->
  <g transform="scale(0.5)">
    <path fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" d="M17 32 V24 A15 15 0 0 1 47 24 V32"/>
    <path fill="currentColor" fill-rule="evenodd" d="
      M18 30 H46 A8 8 0 0 1 54 38 V50 A8 8 0 0 1 46 58 H18 A8 8 0 0 1 10 50 V38 A8 8 0 0 1 18 30 Z
      M34.18 34.65C34.70 38.91 38.44 40.82 38.44 45.69C38.44 50.13 35.57 53.35 31.92 53.35C28.18 53.35 25.57 50.65 25.57 46.91C25.57 43.69 27.91 41.78 28.96 39.08C29.39 41.69 30.52 42.82 31.57 43.35C30.96 39.95 32.00 37.17 34.18 34.65Z"/>
  </g>
  <text x="40" y="23.2" fill="currentColor"
        font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="21" font-weight="700" letter-spacing="-0.5">Firekeep</text>
</svg>
