# Gitleaks configuration — extends the built-in rules.
#
# The CI `secrets` job runs the bare gitleaks binary over the working tree
# AND full history; this file is auto-loaded from the repo root. Allowlist
# entries here must be SPECIFIC PROSE, never secret-shaped patterns: each one
# documents a known false positive that lives permanently in git history
# (history cannot be reworded after the fact).

[extend]
useDefault = true

[allowlist]
description = "Documentation-prose false positives, pinned verbatim"
# Match the whole LINE, not just the redacted secret span — gitleaks'
# default regexTarget is the secret, which for the finding below was only
# the value-shaped token and never contained the identifying prose.
regexTarget = "line"
regexes = [
  # owm.py docstring (identity-v2): the generic-api-key rule matched
  # "re-keyed: corpus/dream/skill" as key:value. The live file was
  # reworded; the regex + commit pin cover the historical commit.
  '''re-keyed: corpus/dream/skill''',
]
commits = [
  # Task 8's original commit carrying the docstring phrase above.
  "cf878aeb2547fcf0ebb894bc4e192feea344117c",
]
