## Lightweight test compose — Redis only, for testing v2 features locally.
## Usage: docker compose -f docker-compose.test.yml up -d

services:
  redis:
    # Pinned to the SAME redis as docker-compose.yml (7.4.10, dual RSALv2 /
    # SSPLv1 — see the full licence note there). Tests that run against a
    # different Redis build than production ships are tests of something we
    # do not sell, so this pin moves when that one moves, together.
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
