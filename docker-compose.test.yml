## Lightweight test compose — Redis only, for testing v2 features locally.
## Usage: docker compose -f docker-compose.test.yml up -d

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
