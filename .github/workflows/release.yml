# Client release — GitHub port of the .gitlab-ci.yml `client-release` job.
#
# Triggered by a `client-v<X.Y.Z>` tag. Builds the client + dex wheels (symdex,
# docdex, maildex), mirrors the pinned uv binaries, runs make_release.py (SHA256SUMS +
# latest.json), and publishes to the `gh-pages` branch in the exact layout the
# bootstrap fetches:
#   <version>/  -> firekeep_client-*.whl, firekeep_symdex-*.whl,
#                  firekeep_docdex-*.whl, firekeep_maildex-*.whl, uv-*, SHA256SUMS
#                  (+ SHA256SUMS.minisig on signed builds; + install.sh/install.ps1,
#                   which the sums list — a version dir must serve what its sums name)
#   latest/     -> install.sh, install.ps1, latest.json (+ signing.pub on signed builds)
# Publishing is ACCUMULATIVE — old <version>/ dirs are preserved so `firekeep update --to`
# keeps resolving them. GitHub Pages is the one public distribution channel —
# every customer installs the same artifacts.
#
# ARTIFACTS GO TO A SEPARATE PUBLIC REPO: kapella-hub/firekeep-dist, served at
# https://kapella-hub.github.io/firekeep-dist. The product source is public now;
# the split remains useful because it keeps accumulated binary release history
# out of the source repository and scopes the artifact-publishing deploy key to
# one replaceable distribution channel. Download access is not the licence
# boundary; integrity is what matters here, and SHA256SUMS provides it.
#
# Cross-repo write uses a deploy key scoped to firekeep-dist alone
# (FIREKEEP_DIST_DEPLOY_KEY). The built-in GITHUB_TOKEN cannot do this: its write
# access stops at the repo running the workflow.
name: client-release

on:
  push:
    tags:
      - 'client-v*'

permissions:
  contents: write   # push artifacts to the gh-pages branch

# gh-pages is a SHARED MUTABLE branch and this job does a read-modify-write of it
# (fetch -> add files -> push). Two tags in flight without this group means the
# loser's push is rejected non-fast-forward and its <version>/ directory never
# publishes at all -- while its job still reports success.
#
# The group MUST be ref-independent. server-release.yml scopes its group to
# ${{ github.ref }}, which is correct there but useless here: two different tags
# are two different refs, so a ref-scoped group would place concurrent releases
# in DIFFERENT groups and serialize nothing.
#
# cancel-in-progress: false -- a half-published release is worse than a queued one.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

env:
  # pinned: the bootstrap verifies uv against SHA256SUMS. 0.5.11 -> 0.8.17
  # because 0.5.11 cannot provision a managed CPython on musl ("No interpreter
  # found for Python 3.12 in managed installations" on Alpine after the musl uv
  # fix made it that far); 0.8.17 downloads the musl python-build-standalone
  # fine. The exact bootstrap flag set (venv --python-preference only-managed
  # --clear; pip install --python --reinstall) verified against 0.8.17 on
  # Alpine 3.20, Ubuntu 24.04 and Windows before this bump.
  UV_VERSION: "0.8.17"
  # Official MCP Registry publisher. Pinned + checksum-verified because this
  # binary receives an OIDC token that can publish under the kapella-hub namespace.
  MCP_PUBLISHER_VERSION: "v1.8.1"
  MCP_PUBLISHER_LINUX_AMD64_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  # ci.yml triggers on `push: branches:[main]` and `pull_request` ONLY, so a
  # `client-v*` tag matches neither and used to run ZERO verification before
  # publishing. A tag on an unmerged hotfix branch would ship a wheel whose own
  # tests had never executed -- including client/tests/test_package.py, which
  # asserts the packaged version. The GitLab pipeline this was ported from gates
  # its release job on tests; that gate was lost in the port.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `pip install pytest` and NOTHING ELSE -- deliberately, copied from ci.yml's
      # client job. The client kit is stdlib-only by design (SP1b import boundary)
      # and tests/test_import_boundary.py enforces it, so a job that installs the
      # client would smuggle in mcp and httpx and defeat the guard it is running.
      # `cd client` puts firekeep_client on sys.path without an install.
      #
      # The first version of this step was
      #   pip install -e "client[dev]" 2>/dev/null || { pip install -e client; pip install pytest; }
      # and it failed the first real release with "No module named pytest": the
      # client declares NO optional-dependencies, so `client[dev]` resolved to a
      # plain SUCCESSFUL install and the || fallback that installed pytest never
      # ran. A fallback behind a command that succeeds is not a fallback.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Client test suite
        run: cd client && python -m pytest tests -q

      - name: Install client transport dependencies
        run: python -m pip install -e client

      - name: Client transport test suite
        # test_stdio_encoding.py runs here as well as in the stdlib-only suite above:
        # its shim and decision.server cases import anyio and importorskip up there.
        # Without this line they are skipped in one place and absent from the other,
        # i.e. never executed — on the fix that stops the Windows client corrupting
        # every non-ASCII string it writes.
        run: cd client && python -m pytest tests/test_shim_*.py tests/test_stdio_encoding.py -q

      - name: Release-path guards
        # These specifically cover what a release depends on being correct:
        # published URLs, package/licence metadata, the public MCP Registry
        # manifest, the manifest builder, and the bootstrap contracts. Registry
        # checks belong here, before PyPI's immutable upload—not in the later
        # Registry job where a failure would strand the client version.
        run: >-
          python -m pytest -q
          tests/test_release_urls.py
          tests/test_package_licence_consistency.py
          tests/test_mcp_registry_manifest.py
          client/tests/test_make_release.py

      - name: Validate MCP Registry manifest with pinned publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLo "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher validate server.json

      # THE GATE THAT EXISTS BECAUSE 0.1.2 SHIPPED A BOOTSTRAP THAT WIPED ITS OWN
      # VENV AT THE WIZARD STEP. docs/RELEASE-GITHUB.md mandates running it before
      # every tag, and until now that was the only place it ran: no workflow
      # invoked it, and the default suite excludes it via `-m 'not e2e'`.
      #
      # Worse, it is unrunnable where it was documented to be run by hand. The
      # suite skips wholesale on os.name == "nt" (test_e2e_bootstrap.py:23), so on
      # the author's Windows machine all five tests skip even with uv installed --
      # and a skipped gate is not a passed gate. Only a POSIX runner can execute
      # it, which makes CI the only honest home for it.
      #
      # It drives the REAL install.sh against a locally built wheel, including the
      # wizard hand-off, so it is the only thing that exercises venv provisioning
      # end to end.
      - name: Install e2e prerequisites (uv + build)
        run: |
          # `python3 -m build` -- test_e2e_bootstrap.py shells out to it to produce
          # the client and both dex wheels the bootstrap then installs. Not implied
          # by `pip install pytest`, so the suite would fail at fixture setup rather
          # than skip.
          python -m pip install build
          curl -fsSL https://astral.sh/uv/install.sh | sh

      - name: E2E bootstrap gate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv --version
          cd client && python -m pytest tests/test_e2e_bootstrap.py -m e2e -q

  release:
    needs: test
    runs-on: ubuntu-latest
    # Every `run:` here uses `bash -eo pipefail`, not the Linux default `bash -e`.
    # Without pipefail, `a | b` reports b's exit status: a failing `curl` piped
    # into `tar`, or a failing `install.sh` piped into `tee`, both report success
    # and the job goes green over a broken result. Guarded by
    # tests/test_workflow_pipefail.py.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve + verify version
        run: |
          VERSION="${GITHUB_REF_NAME#client-v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # The tag is the source of truth; both version markers must agree or the
          # release is wrong (mirrors the GitLab guard).
          grep -q "^version = \"${VERSION}\"$" client/pyproject.toml \
            || { echo "tag ${GITHUB_REF_NAME} != client/pyproject.toml version"; exit 1; }
          grep -q "^__version__ = \"${VERSION}\"$" client/firekeep_client/__init__.py \
            || { echo "tag ${GITHUB_REF_NAME} != firekeep_client.__version__"; exit 1; }

      - name: Build client + dex wheels
        run: |
          python -m pip install build
          mkdir -p dist
          (cd client && python -m build --wheel --outdir ../dist)
          (cd symdex && python -m build --wheel --outdir ../dist)
          (cd docdex && python -m build --wheel --outdir ../dist)
          (cd maildex && python -m build --wheel --outdir ../dist)

      - name: Fresh-wheel MCP compatibility smoke
        run: |
          SMOKE_VENV="${RUNNER_TEMP}/firekeep-wheel-smoke"
          python -m venv "${SMOKE_VENV}"
          "${SMOKE_VENV}/bin/python" -m pip install --disable-pip-version-check dist/firekeep_client-*.whl
          "${SMOKE_VENV}/bin/python" - <<'PY'
          import asyncio
          import importlib.metadata
          import json

          import httpx
          from firekeep_client.shim import RecoveringMCPClient
          from mcp.client.session import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          mcp_version = importlib.metadata.version("mcp")
          assert mcp_version.split(".", 1)[0] == "1", f"unsupported mcp {mcp_version}"

          def handler(request: httpx.Request) -> httpx.Response:
              message = json.loads(request.content)
              if message.get("method") == "initialize":
                  return httpx.Response(
                      200,
                      json={
                          "jsonrpc": "2.0",
                          "id": message["id"],
                          "result": {
                              "protocolVersion": "2025-06-18",
                              "capabilities": {},
                              "serverInfo": {"name": "wheel-smoke", "version": "0"},
                          },
                      },
                      headers={"content-type": "application/json"},
                  )
              if message.get("method") == "tools/list":
                  return httpx.Response(
                      200,
                      json={
                          "jsonrpc": "2.0",
                          "id": message["id"],
                          "result": {"tools": []},
                      },
                      headers={"content-type": "application/json"},
                  )
              return httpx.Response(202)

          async def smoke() -> None:
              async with RecoveringMCPClient(
                  transport=httpx.MockTransport(handler),
                  base_url="http://wheel-smoke",
              ) as client:
                  async with streamable_http_client(
                      "http://wheel-smoke/mcp", http_client=client
                  ) as (read, write, _get_session_id):
                      async with ClientSession(read, write) as session:
                          initialized = await session.initialize()
                          assert initialized.serverInfo.name == "wheel-smoke"
                          tools = await session.list_tools()
                          assert tools.tools == []

          asyncio.run(smoke())
          print(f"fresh wheel initialized with mcp {mcp_version}")
          PY

      - name: Mirror uv binaries
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin \
                   x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${t}.tar.gz" \
              | tar -xz -O --wildcards '*/uv' > "dist/uv-${t}"
          done
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-pc-windows-msvc.zip" -o /tmp/uv.zip
          python -c "import zipfile; zipfile.ZipFile('/tmp/uv.zip').extract('uv.exe','dist')"
          mv dist/uv.exe dist/uv-x86_64-pc-windows-msvc.exe

      - name: Assemble release (SHA256SUMS + latest.json + signature)
        # FIREKEEP_SIGNING_KEY (unencrypted minisign secret key, minted per
        # docs/RELEASE-SIGNING.md) makes make_release sign SHA256SUMS and bake the
        # public key into the bootstraps. ABSENT -> the release is built UNSIGNED,
        # with a loud log line — releases must not break before keys are minted.
        env:
          FIREKEEP_SIGNING_KEY: ${{ secrets.FIREKEEP_SIGNING_KEY }}
        run: |
          cp client/bootstrap/install.sh client/bootstrap/install.ps1 dist/
          python client/scripts/make_release.py "${VERSION}" dist --dist-base "https://kapella-hub.github.io/firekeep-dist"

      # The deploy key is written to disk and used via GIT_SSH_COMMAND rather than
      # ssh-agent: an agent is per-process and the several git invocations below
      # would each need it inherited, which is more moving parts than a scoped
      # env var. StrictHostKeyChecking=accept-new pins github.com on first use
      # without prompting; `no` would accept ANY host key, which is the actual
      # hazard here since this credential can write to the published channel.
      - name: Authorise publishing to firekeep-dist
        env:
          DEPLOY_KEY: ${{ secrets.FIREKEEP_DIST_DEPLOY_KEY }}
        run: |
          [ -n "${DEPLOY_KEY}" ] || { echo "::error::FIREKEEP_DIST_DEPLOY_KEY is not set — cannot publish"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # `echo`, not `printf '%s\n'`: a literal \n inside a YAML block scalar is
          # a real newline and breaks the block. An SSH private key must also end
          # with a trailing newline or ssh rejects it as malformed, which echo gives.
          echo "${DEPLOY_KEY}" > ~/.ssh/firekeep_dist
          chmod 600 ~/.ssh/firekeep_dist
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/firekeep_dist -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          echo "DIST_REMOTE=git@github.com:kapella-hub/firekeep-dist.git" >> "$GITHUB_ENV"

      - name: Publish to firekeep-dist gh-pages (accumulative)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A DIFFERENT repo than the one this workflow runs in, so `origin` is
          # wrong here — origin is FirekeepHQ, whose gh-pages could never serve.
          git remote remove dist 2>/dev/null || true
          git remote add dist "${DIST_REMOTE}"
          if git ls-remote --exit-code --heads dist gh-pages >/dev/null 2>&1; then
            # --depth=1: without it every run clones the FULL accumulated binary
            # history of every prior release just to add one directory.
            git fetch --depth=1 dist gh-pages
            git worktree add gh FETCH_HEAD
            git -C gh checkout -B gh-pages
          else
            git worktree add --orphan -b gh-pages gh
          fi
          mkdir -p "gh/${VERSION}" gh/latest

          # The versioned copy is UNCONDITIONAL: `firekeep update --to <older>`
          # resolves that version's own wheel and SHA256SUMS from here, so every
          # release must land in its own directory even when re-run.
          #
          # The bootstraps are published under <version>/ TOO (not only latest/):
          # make_release lists install.sh/install.ps1 in <version>/SHA256SUMS
          # because the signature over that file is what anchors the script
          # `firekeep update` executes (updater.bootstrap_sha256 cross-checks the
          # unsigned latest.json against the signed entries) — the listing is
          # load-bearing and cannot be dropped, so the fix for "listed but not
          # served" is to serve them: a version directory whose sums describe
          # files it does not carry is a sums file that lies about its own tree.
          cp dist/firekeep_client-*.whl dist/firekeep_symdex-*.whl \
             dist/firekeep_docdex-*.whl dist/firekeep_maildex-*.whl dist/uv-* \
             dist/SHA256SUMS dist/install.sh dist/install.ps1 "gh/${VERSION}/"
          # The signature rides with its SHA256SUMS. Conditional because unsigned
          # builds (no FIREKEEP_SIGNING_KEY secret yet) produce no .minisig — the
          # client treats absence as a warning, never as an error, until
          # [dist] require_signed flips.
          if [ -f dist/SHA256SUMS.minisig ]; then
            cp dist/SHA256SUMS.minisig "gh/${VERSION}/"
          fi

          # The latest/ pointer is GUARDED. Re-running an older tag's workflow
          # used to rewrite this pointer BACKWARDS, and nothing repairs the fleet
          # afterwards: updater.is_newer("0.1.20", "0.1.23") is False, so every
          # client already on a newer version reports "already up to date"
          # forever and background auto-update never fires again. Silent fleet
          # pinning with no error at any layer. Verified by execution, not read.
          # Single-line python -c only. A multi-line embedded script breaks the
          # YAML block scalar's indentation and the whole workflow stops parsing.
          publish_latest=1
          if [ -f gh/latest/latest.json ]; then
            prev="$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("version",""))' gh/latest/latest.json 2>/dev/null || echo '')"
            if [ -n "$prev" ]; then
              # Reuses the SHIPPED comparison, not a reimplementation of it: this
              # is the exact predicate every client runs to decide whether an
              # update applies, so the publish rule and the client rule cannot drift.
              if ! PYTHONPATH=client python -c 'import sys;from firekeep_client.updater import is_newer;sys.exit(0 if is_newer(sys.argv[1],sys.argv[2]) else 1)' "${VERSION}" "$prev"; then
                publish_latest=0
                echo "::warning::latest/ already points at ${prev} (>= ${VERSION}); publishing ${VERSION}/ but NOT moving the pointer backwards."
              fi
            fi
          fi
          if [ "$publish_latest" = "1" ]; then
            cp dist/install.sh dist/install.ps1 dist/latest.json gh/latest/
            # Transparency copy of the release signing public key (the TRUST ANCHOR is
            # the key pinned in the installed client, never this file — a host that can
            # tamper with artifacts can tamper with this too; it exists so humans and
            # tooling can compare out of band). Guarded by publish_latest like the rest
            # of latest/, and by existence: unsigned builds publish no key.
            if [ -f dist/signing.pub ]; then
              cp dist/signing.pub gh/latest/
            fi
          fi

          touch gh/.nojekyll   # serve files verbatim; no Jekyll rewriting
          git -C gh add -A
          # `exit 0` here is deliberate but narrow: a re-run of an ALREADY
          # published tag legitimately produces no diff. It must not mask a
          # failed copy, which is why the verify step below fetches the live
          # site rather than trusting this job's exit status.
          git -C gh commit -m "release ${VERSION}" || { echo "nothing to publish"; exit 0; }

          # Retry the push: the concurrency group serialises this workflow, but a
          # manual gh-pages edit between fetch and push would still reject it.
          for attempt in 1 2 3; do
            if git -C gh push dist gh-pages; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); re-fetching and retrying"
            git -C gh fetch --depth=1 dist gh-pages && git -C gh rebase FETCH_HEAD || true
          done
          echo "::error::could not push to gh-pages after 3 attempts"
          exit 1

      # The workflow's last act used to be `git push`, so NOTHING at any layer
      # ever confirmed the artifacts were actually SERVED. Pages can be disabled,
      # the site build can fail on size, or the repo can be private (it is) --
      # and in every one of those cases this job still reported success while
      # clients fetched nothing.
      #
      # This step is also the detector for the unresolved distribution question:
      # it is EXPECTED to fail on run #1 until Pages is genuinely serving.
      - name: Verify the release is actually served
        run: |
          BASE="https://kapella-hub.github.io/firekeep-dist"
          manifest_ok=""
          for i in $(seq 1 60); do
            got="$(curl -fsS "${BASE}/latest/latest.json" 2>/dev/null \
                   | python -c "import json,sys;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo '')"
            if [ "$got" = "${VERSION}" ]; then
              manifest_ok=1
              break
            fi
            [ -n "$got" ] && echo "  serving ${got}, waiting for ${VERSION} (${i}/24)" \
                          || echo "  not served yet (${i}/24)"
            sleep 10
          done
          if [ -z "$manifest_ok" ]; then
            echo "::error::${BASE}/latest/latest.json did not serve ${VERSION} within 10 minutes."
            echo "::error::If this is the first release: GitHub Pages is not enabled, or cannot be."
            echo "::error::Pages requires a PUBLIC repo (or GitHub Enterprise). See docs/RELEASE-GITHUB.md."
            exit 1
          fi
          echo "verified: ${BASE}/latest/latest.json serves ${VERSION}"
          # When this release was SIGNED, the signature must be SERVED, not merely
          # built: the client's whole verification path hangs off
          # <version>/SHA256SUMS.minisig, and a green publish with a missing (or
          # different) .minisig silently downgrades every updating client to the
          # unsigned warning path. Byte-compare against the built signature —
          # merely fetching 200 would pass against a stale or foreign file.
          if [ -f dist/SHA256SUMS.minisig ]; then
            sig_ok=""
            for i in $(seq 1 60); do
              if curl -fsS "${BASE}/${VERSION}/SHA256SUMS.minisig" -o served.minisig 2>/dev/null \
                 && cmp -s served.minisig dist/SHA256SUMS.minisig; then
                sig_ok=1
                break
              fi
              echo "  ${VERSION}/SHA256SUMS.minisig not served yet (${i}/24)"
              sleep 10
            done
            if [ -z "$sig_ok" ]; then
              echo "::error::${BASE}/${VERSION}/SHA256SUMS.minisig is not served (or differs from the built signature)."
              echo "::error::Clients updating to ${VERSION} would silently fall back to the unsigned path."
              exit 1
            fi
            echo "verified: ${BASE}/${VERSION}/SHA256SUMS.minisig serves the built signature"
          else
            echo "release was built UNSIGNED (no FIREKEEP_SIGNING_KEY) — no .minisig to verify"
          fi

  # --- PyPI (Trusted Publishing / OIDC) --------------------------------------
  # Publishes firekeep-client, firekeep-symdex, firekeep-docdex and firekeep-maildex to
  # PyPI so `pip install firekeep-client` works and the official MCP registry can
  # reference a public package (server.json at the repo root; docs/RELEASE-GITHUB.md
  # "PyPI and the MCP registry"). No token secret: OIDC trusted publishing, ONE MATRIX LEG
  # PER PACKAGE with its own GitHub environment ("pypi" for the client, "pypi-symdex"
  # for symdex, "pypi-docdex" for docdex, "pypi-maildex" for maildex) — PyPI refuses two
  # pending publishers sharing an identical (owner, repo, workflow, environment)
  # tuple, so the environment is the disambiguator, and it also keeps each leg's
  # OIDC token scoped to exactly one project. Each environment must exist in this
  # repo's settings BEFORE the tag, and each name must have a pending publisher on
  # PyPI. A missing or misconfigured publisher fails its leg
  # loudly without touching the dist-host publication above — the same
  # misconfiguration ethos as release signing. skip-existing only on the DEX
  # legs, which bump on their own cadences: an already-published dex
  # version is a no-op, not an error, while a re-tagged client version still
  # fails (PyPI versions are immutable, and re-tagging a published client
  # version is a mistake worth hearing about).
  pypi:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_dir: client
            environment: pypi
            skip_existing: false
          - package_dir: symdex
            environment: pypi-symdex
            skip_existing: true
          - package_dir: docdex
            environment: pypi-docdex
            skip_existing: true
          - package_dir: maildex
            environment: pypi-maildex
            skip_existing: true
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build ${{ matrix.package_dir }} -o pypi-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist
          skip-existing: ${{ matrix.skip_existing }}

  # --- Official MCP Registry -------------------------------------------------
  # Separate from the PyPI matrix on purpose. A registry retry must never rerun
  # firekeep-client's immutable PyPI upload (whose skip-existing is correctly
  # false). The Registry is also immutable per version, so a rerun first verifies
  # an existing exact version and skips publication only when the bytes agree.
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify MCP Registry release metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#client-v}"
          python - "${VERSION}" <<'PY'
          import json
          import sys

          expected = sys.argv[1]
          data = json.load(open("server.json", encoding="utf-8"))
          packages = [p for p in data.get("packages", []) if p.get("identifier") == "firekeep-client"]
          assert data.get("$schema") == "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json"
          assert "status" not in data, "status is Registry-owned metadata"
          assert data.get("version") == expected
          assert len(packages) == 1 and packages[0].get("version") == expected
          PY

      - name: Wait for firekeep-client on PyPI
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#client-v}"
          visible=""
          for attempt in $(seq 1 60); do
            if curl -fsS "https://pypi.org/pypi/firekeep-client/${VERSION}/json" -o pypi.json \
              && python - "${VERSION}" <<'PY'
          import json
          import sys

          expected = sys.argv[1]
          info = json.load(open("pypi.json", encoding="utf-8"))["info"]
          assert info["version"] == expected
          assert "mcp-name: io.github.kapella-hub/firekeep" in info.get("description", "")
          PY
            then
              visible=1
              break
            fi
            echo "PyPI has not exposed firekeep-client ${VERSION} with its ownership marker yet (${attempt}/60)"
            sleep 10
          done
          [ -n "${visible}" ] || { echo "::error::firekeep-client ${VERSION} was not visible on PyPI within 10 minutes"; exit 1; }

      - name: Install pinned MCP Registry publisher
        shell: bash
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLo "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Check exact MCP Registry version
        id: registry-version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#client-v}"
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.kapella-hub%2Ffirekeep/versions/${VERSION}"
          code="$(curl -sS -o registry-existing.json -w '%{http_code}' "${URL}")"
          case "${code}" in
            200)
              python - <<'PY'
          import json

          expected = json.load(open("server.json", encoding="utf-8"))
          actual = json.load(open("registry-existing.json", encoding="utf-8"))["server"]
          assert actual == expected, "Registry already has this immutable version with different metadata"
          PY
              echo "exists=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "exists=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Registry exact-version lookup returned HTTP ${code}"
              exit 1
              ;;
          esac

      - name: Authenticate to MCP Registry
        if: steps.registry-version.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.registry-version.outputs.exists != 'true'
        shell: bash
        run: |
          set +e
          ./mcp-publisher publish server.json
          publish_status=$?
          set -e
          if [ "${publish_status}" -ne 0 ]; then
            VERSION="${GITHUB_REF_NAME#client-v}"
            URL="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.kapella-hub%2Ffirekeep/versions/${VERSION}"
            code="$(curl -sS -o registry-after-error.json -w '%{http_code}' "${URL}")"
            [ "${code}" = "200" ] || exit "${publish_status}"
            echo "publisher returned ${publish_status}, but the immutable version exists; final verification will decide"
          fi

      - name: Verify official MCP Registry publication
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#client-v}"
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.kapella-hub%2Ffirekeep/versions/${VERSION}"
          served=""
          for attempt in $(seq 1 60); do
            if curl -fsS "${URL}" -o registry-live.json \
              && python - <<'PY'
          import json

          expected = json.load(open("server.json", encoding="utf-8"))
          response = json.load(open("registry-live.json", encoding="utf-8"))
          assert response["server"] == expected
          assert response["_meta"]["io.modelcontextprotocol.registry/official"]["status"] == "active"
          PY
            then
              served=1
              break
            fi
            echo "Registry has not served the exact verified version yet (${attempt}/60)"
            sleep 10
          done
          [ -n "${served}" ] || { echo "::error::Registry did not serve verified Firekeep ${VERSION} within 10 minutes"; exit 1; }
