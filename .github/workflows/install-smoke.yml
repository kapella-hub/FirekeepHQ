name: Install smoke (the stranger test)

# The defect class this exists to catch: the stack worked on exactly one
# machine — its author's. This runs the documented install on a clean runner
# with nothing preconfigured.
# Manual-trigger ONLY while the install is still broken. This workflow is
# written before the fixes and is expected to fail; gating PRs on a
# known-red check trains people to ignore it. Task 11 adds the automatic
# triggers once it is green.
on:
  workflow_dispatch:

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every `run:` here uses `bash -eo pipefail`, not the Linux default `bash -e`.
    # Without pipefail, `a | b` reports b's exit status: a failing `curl` piped
    # into `tar`, or a failing `install.sh` piped into `tee`, both report success
    # and the job goes green over a broken result. Guarded by
    # tests/test_workflow_pipefail.py.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Record runner resources (these become the docs' sizing figures)
        run: |
          free -h
          df -h /
          nproc
          docker --version && docker compose version

      - name: Reclaim runner disk before pulling ~3.3GB of models
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Run the documented install non-interactively
        env:
          # A stranger runs `bash install.sh` and answers two prompts.
          # No flags: this must exercise the SHIPPED defaults, which since
          # audit blocker 7 means auth enforced. Adding --insecure-no-auth
          # here would make every assertion below test the wrong product.
          FIREKEEP_SMOKE_VPS_IP: "127.0.0.1"
          FIREKEEP_SMOKE_NEO4J_PASSWORD: "smoke-test-password"
        # `shell: bash` is load-bearing, not style. The DEFAULT shell for a
        # `run:` step on Linux is `bash -e {0}` -- WITHOUT pipefail. Piping
        # install.sh into `tee` moved it out of the last position, so the step's
        # exit status became tee's, which is always 0: a failing install would
        # have reported success and every assertion below would then run against
        # a half-built stack. `shell: bash` selects
        # `bash --noprofile --norc -eo pipefail {0}`, which restores it -- and
        # makes the two later comments in this file that already claim
        # "the step shell is bash -eo pipefail" true.
        #
        # NOTE: install.log holds the one-time admin key install.sh prints. The
        # runner is destroyed after the job and nothing uploads it as an
        # artifact. Do not add an upload-artifact step for it.
        run: |
          printf '%s\n%s\n' "$FIREKEEP_SMOKE_VPS_IP" "$FIREKEEP_SMOKE_NEO4J_PASSWORD" \
            | bash install.sh 2>&1 | tee install.log

      - name: Assert no unsubstituted placeholders survived in .env
        run: |
          if grep -nE "<VPS_IP>|YOUR_VPS_IP_HERE" .env; then
            echo "::error::unsubstituted placeholder(s) left in .env"
            exit 1
          fi
          echo "no placeholders remain"

      - name: Assert every service reports healthy
        run: |
          for port in 8100 8070 8060 8050; do
            echo "--- probing :$port/health"
            curl -fsS --retry 30 --retry-delay 5 --retry-all-errors \
              "http://127.0.0.1:$port/health" || exit 1
            echo
          done

      - name: Assert the dashboard serves
        # No -f here: once dashboard/.htpasswd exists nginx correctly 401s
        # every unauthenticated request (including this probe), and -f would
        # treat that as failure. A 401 is proof nginx is up and enforcing
        # auth, not evidence of a broken dashboard -- only inspect the code.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:8040/)
          echo "dashboard http_code=$code"
          case "$code" in
            2??|401) echo "dashboard responded ($code)" ;;
            *) echo "::error::dashboard did not respond as expected (got $code)"; exit 1 ;;
          esac

      - name: Assert the dashboard's own generated credentials actually authenticate
        # The 401 probe above only proves nginx is enforcing auth -- it is
        # ALSO exactly what nginx returns when ngx_crypt cannot parse the
        # stored hash at all (e.g. an apr1 hash on a build that can't verify
        # it). A dashboard that no credential could ever open would keep
        # that check permanently green. Read the credentials install.sh
        # actually wrote and require a genuine 2xx with them -- the only
        # check in this workflow that would catch a hash nginx rejects,
        # and what validates the htpasswd/openssl algorithm choice in
        # install.sh's "Dashboard basic auth" block.
        run: |
          if [ ! -f dashboard/.htpasswd.cred ]; then
            echo "::error::dashboard/.htpasswd.cred is missing -- cannot verify the generated credentials work"
            exit 1
          fi
          DASH_USER="$(sed -n 's/^user=//p' dashboard/.htpasswd.cred)"
          DASH_PASS="$(sed -n 's/^pass=//p' dashboard/.htpasswd.cred)"
          if [ -z "$DASH_USER" ] || [ -z "$DASH_PASS" ]; then
            echo "::error::dashboard/.htpasswd.cred did not parse to a user/pass pair"
            exit 1
          fi
          echo "::add-mask::$DASH_PASS"
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "${DASH_USER}:${DASH_PASS}" \
            --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8040/)
          echo "authenticated dashboard http_code=$code"
          case "$code" in
            2??) echo "dashboard authenticated successfully ($code)" ;;
            *) echo "::error::dashboard rejected the installer's own generated credentials (got $code) -- the stored password hash is likely unparseable by nginx"; exit 1 ;;
          esac

      - name: Assert the shipped default closes the vault to unauthenticated callers
        # On the shipped default this returned 200 and the metadata of every
        # stored secret to an unauthenticated caller; on the author's own VPS
        # that meant 12 real secrets reachable from the public internet. 401 is
        # the only acceptable answer.
        #
        # SCOPE, stated so this is not read as more than it is: blocker 7 had
        # TWO remedies and this job only exercises the first. Everything here
        # runs against AUTH_ENABLED=true, where FirekeepKeyAuthMiddleware
        # rejects at auth/asgi.py before routing and before any scope check —
        # so the second remedy (the anonymous identity losing `admin`, which
        # protects a deployment that deliberately turns auth OFF) is never
        # touched. Revert auth/keys.py entirely and this job stays green.
        #
        # That half is covered by unit tests instead, deliberately: proving it
        # end-to-end would need a second 45-minute install with
        # --insecure-no-auth, for a configuration no customer should run.
        #   auth/tests/test_anonymous_scopes.py
        #   cortex/tests/test_auth_anonymous_scopes.py
        #   cortex/tests/test_auth_admin_router_gating.py
        #   vault/tests/test_vault.py::TestVaultAdminGate
        #   bridge/tests/test_distill_requeue.py
        #
        # The other two codes are named explicitly because they fail for
        # DIFFERENT reasons and a bare "not 401" would hide which:
        #   503 — AUTH_ENABLED regressed to false. cortex then refuses to
        #         mount /vault/* at all and serves the disabled-surface router
        #         instead (cortex/app/main.py). The stack is open again.
        #   200 — the route is mounted and answered an unkeyed request. The
        #         middleware is not enforcing. This is the original bug.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8100/vault/secrets)
          echo "unauthenticated GET /vault/secrets -> $code"
          case "$code" in
            401) echo "vault is closed to unauthenticated callers" ;;
            503) echo "::error::AUTH_ENABLED is false on a default install — the blocker-7 remedy has regressed"; exit 1 ;;
            200) echo "::error::/vault/secrets served an UNAUTHENTICATED request — secrets are exposed"; exit 1 ;;
            *)   echo "::error::unexpected response from /vault/secrets ($code)"; exit 1 ;;
          esac

      - name: Assert a memory round-trips — rejected unkeyed, works with the minted key
        # Two-sided ON PURPOSE. The keyed round-trip alone is not a test of
        # this fix: it passes just as happily against a wide-open stack, so if
        # the default ever flipped back to unauthenticated this job would stay
        # green. The unkeyed half is what makes the check discriminate.
        #
        # And the keyed half is not merely "the key works": it asserts the
        # written memory comes BACK, so a genuinely broken write/embed/recall
        # path still fails here even when auth is perfectly configured.
        run: |
          # (1) Unkeyed must be REJECTED.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8100/memory/learn \
            -H 'Content-Type: application/json' \
            -d '{"domain":"smoke","action":"unauthenticated probe","outcome":"must be rejected"}')
          echo "unauthenticated POST /memory/learn -> $code"
          if [ "$code" != "401" ]; then
            echo "::error::POST /memory/learn accepted an unauthenticated write (got $code, want 401)"
            exit 1
          fi

          # (2) Keyed must round-trip. FIREKEEP_INTERNAL_KEY is minted into .env
          # by deploy/bootstrap-keys.sh during the install above -- this is the
          # operator's real post-install path, not a key manufactured by CI.
          # `|| true` because the step shell is `bash -eo pipefail`: a grep
          # miss would otherwise abort with no diagnosis of WHY.
          KEY="$(grep '^FIREKEEP_INTERNAL_KEY=' .env | cut -d= -f2- || true)"
          if [ -z "$KEY" ]; then
            echo "::error::install.sh did not mint FIREKEEP_INTERNAL_KEY into .env"
            exit 1
          fi
          echo "::add-mask::$KEY"

          curl -fsS -X POST http://127.0.0.1:8100/memory/learn \
            -H 'Content-Type: application/json' \
            -H "X-API-Key: $KEY" \
            -d '{"domain":"smoke","action":"ran the install smoke test",
                 "outcome":"the stack accepted a write"}'
          sleep 5
          BODY=$(curl -fsS -X POST http://127.0.0.1:8100/memory/recall \
            -H 'Content-Type: application/json' \
            -H "X-API-Key: $KEY" \
            -d '{"task":"install smoke test","format":"raw"}')
          echo "$BODY"
          echo "$BODY" | grep -q "smoke" || { echo "::error::recall did not return the written memory"; exit 1; }

      - name: Assert every key the stack needs to talk to itself was minted
        # Under AUTH_ENABLED=true the internal service-to-service calls are no
        # longer optional plumbing -- an unminted key means a silent 401 on a
        # path that swallows its own failures. RELAY_INTERNAL_API_KEY is the
        # one that was missing: docker-compose.yml has always read it
        # (NR_FIREKEEP_API_KEY: ${RELAY_INTERNAL_API_KEY:-}) but nothing minted
        # it, so Relay's NexusScope decision writes into Bridge went out
        # unkeyed. Bridge gates that route on session:write, and
        # relay/app/scope.py _persist_to_bridge is best-effort -- it would have
        # logged a warning and dropped the decision, with nothing user-visible.
        run: |
          rc=0
          for var in FIREKEEP_INTERNAL_KEY DASHBOARD_API_KEY RELAY_INTERNAL_API_KEY; do
            val="$(grep "^${var}=" .env | cut -d= -f2- || true)"
            if [ -z "$val" ]; then
              echo "::error::${var} is empty or absent in .env after install"
              rc=1
            else
              echo "::add-mask::$val"
              echo "$var: minted"
            fi
          done
          exit $rc

      - name: Assert the installer told the operator how to authenticate
        # With auth on by default, an operator who finishes the install without
        # the admin key cannot mint teammate keys or read the vault -- and the
        # key is printed once and deliberately never stored. bootstrap-keys.sh
        # prints it near the START of the run, before a container build and a
        # ~3.3GB model pull, so by the time the summary appears it is thousands
        # of lines up the scrollback. install.sh re-surfaces it in the closing
        # summary; if that ever silently stops happening, a fresh install
        # becomes unadministrable and nothing else in this job would notice.
        run: |
          rc=0
          grep -q 'Auth:          ENFORCED' install.log \
            || { echo "::error::summary did not report auth as ENFORCED"; rc=1; }
          grep -q 'ADMIN API KEY' install.log \
            || { echo "::error::summary did not surface the admin API key"; rc=1; }
          grep -q 'firekeep-admin keys create' install.log \
            || { echo "::error::summary did not show how to issue a teammate key"; rc=1; }
          # The admin key block must appear AFTER the health checks, not only
          # in bootstrap-keys.sh's output at the top -- that is the entire
          # point of re-surfacing it.
          #
          # `|| true` on both: the step shell is `bash -eo pipefail`, so a grep
          # that matches nothing would abort the step right here and the
          # ::error:: below would never print -- turning a precise diagnosis
          # into a silent exit code.
          last_admin=$(grep -n 'ADMIN API KEY' install.log | tail -n1 | cut -d: -f1 || true)
          firekeep_running=$(grep -n 'Firekeep is running' install.log | tail -n1 | cut -d: -f1 || true)
          if [ -z "$last_admin" ] || [ -z "$firekeep_running" ] || [ "$last_admin" -lt "$firekeep_running" ]; then
            echo "::error::the admin key is not reprinted in the closing summary (only at the top, where it scrolls away)"
            rc=1
          fi
          exit $rc

      - name: Record the real resource high-water mark
        run: |
          free -h
          df -h /
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}'

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 100
          free -h
          df -h /
