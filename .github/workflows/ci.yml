name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cortex: fully-mocked suite. requirements.txt provides every dep the
          # shared modules (replay/auth/vault/corpus) need — they are imported via
          # sys.path by cortex/tests/conftest.py.
          #
          # This comment used to say requirements.txt "brings scikit-learn (-> joblib)
          # so the full suite incl. test_ranker runs". Neither is true: scikit-learn is
          # in no requirements file (checked at HEAD and in history) and test_ranker
          # does not exist — the recall-ranker was deleted and the comment outlived it.
          # Found by asserting sklearn imported in the built cortex image; it does not.
          - name: cortex
            install: pip install -r cortex/requirements.txt -r cortex/requirements-dev.txt
            test: pytest cortex/tests -q
          - name: bridge
            install: pip install -r bridge/requirements.txt -r bridge/requirements-dev.txt
            test: pytest bridge/tests -q
          - name: sentinel
            install: pip install -r sentinel/requirements.txt -r sentinel/requirements-dev.txt
            test: pytest sentinel/tests -q
          - name: relay
            install: pip install -r relay/requirements.txt -r relay/requirements-dev.txt
            test: pytest relay/tests -q
          - name: symdex
            install: pip install -e "symdex[test]"
            test: pytest symdex/tests -q
          # Shared libraries — no requirements files of their own (deps live in
          # cortex/requirements.txt). All tests use fakeredis; no live backends.
          - name: shared-modules
            install: pip install -r cortex/requirements.txt pytest pytest-asyncio fakeredis
            test: pytest replay/tests auth/tests vault/tests corpus/tests -q
          # Client kit: package smoke test + the import-boundary guard. Pure
          # stdlib + pytest — no mcp/httpx install, so the boundary job can never
          # itself smuggle the deps it forbids. `cd client` puts firekeep_client on
          # sys.path; the boundary walker reaches symdex/src via the repo root.
          - name: client
            install: pip install pytest
            test: cd client && python -m pytest tests -q
          # HTTP-backed shim tests need the package's mcp/httpx/anyio dependencies.
          # Keep them in a separate matrix entry so the stdlib-only client job
          # above remains an honest import-boundary check.
          - name: client-transport
            install: pip install -e ./client pytest
            test: cd client && python -m pytest tests/test_shim_*.py -q
          # Root tests/ — deploy scripts, provenance, backup/restore, the support
          # bundle, and the install/update health-probe guard. NOTHING RAN THESE
          # IN CI: the `licenses` and `forbidden-tokens` jobs each invoke one
          # single FILE from this directory, which is what made the gap look
          # covered. 123 tests over the install path, and the install path is
          # where the defects have actually been. pytest + pyyaml only (the
          # compose-provenance checks parse docker-compose.yml); bash comes with
          # the runner and test_install_health_probe.py needs a real one.
          - name: repo-scripts
            install: pip install pytest pyyaml packaging
            # `python -m pytest`, NOT `pytest`. The console script does not put the
            # CWD on sys.path; `python -m` does. tests/test_provenance.py imports
            # the repo-root `provenance` package, so the two invocations differ —
            # and I only ever ran the `python -m` form locally, which is exactly
            # how a job can be red for eight commits while local is green.
            test: python -m pytest tests -q
          # deploy/tests/test_auth_posture.sh drives install.sh's and
          # deploy/lib.sh's summary/warning logic in a sandbox — no Docker, no
          # network, no containers. It is the only thing that checks the text an
          # operator is shown about auth posture and port exposure, which is
          # where two false-reassurance defects have already shipped (a
          # "Vault: Enabled" line for a vault that answers 503, and firewall
          # advice that Docker bypasses). It ran nowhere until now.
          # Its siblings in deploy/tests/ DO need Docker and stay out of CI.
          - name: deploy-posture
            install: "true"
            test: bash deploy/tests/test_auth_posture.sh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: ${{ matrix.install }}
      - name: Run tests
        run: ${{ matrix.test }}

  client-windows:
    name: client (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # The POSIX bootstrap tests self-skip on nt; the PowerShell ones un-skip here.
      # This job exists to execute install.ps1 at all -- nothing else in CI ever does.
      #
      # Two separate steps, not `cd client && ...`: the default shell for `run:` on
      # windows-latest is pwsh, and this job's only reason to exist is to actually run
      # things nobody can verify on POSIX CI -- it should not itself lean on an assumption
      # about pwsh's `&&` chaining that nobody here can check.
      - run: pip install pytest
      # On failure, surface the pytest tail as ONE ::error:: annotation: annotations
      # are publicly readable on this repo while raw job logs require auth, and
      # nobody on the team has a Windows box — this job must be debuggable from the
      # public API alone.
      - run: |
          python -m pytest tests -q 2>&1 | Tee-Object -FilePath pytest-out.txt
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content pytest-out.txt -Tail 60) -join '%0A'
            Write-Output "::error title=client (windows) pytest failure::$tail"
            exit 1
          }
        shell: pwsh
        working-directory: client

  symdex-windows:
    name: symdex (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # symdex/src/firekeep_symdex/storage/index_store.py selects its history-file
      # locking primitive by `try: import fcntl / except ImportError: import msvcrt`,
      # so the ubuntu `symdex` matrix entry above can only ever take the POSIX
      # branch. This job is the only place in CI that reaches the msvcrt branch,
      # mirroring client-windows above it.
      #
      # It exists because that branch was added blind: an unconditional `import
      # fcntl` had made every save_index() call raise on Windows (150 failed,
      # 31 collection errors) and no CI job could see it. A platform branch with
      # no CI on the other side is an untested branch -- this is the gate, not
      # the fix.
      - run: pip install -e "symdex[test]"
      # On failure, surface the pytest tail as ONE ::error:: annotation: annotations
      # are publicly readable on this repo while raw job logs require auth, and
      # nobody on the team has a Windows box — this job must be debuggable from the
      # public API alone.
      - run: |
          python -m pytest symdex/tests -q 2>&1 | Tee-Object -FilePath pytest-out.txt
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content pytest-out.txt -Tail 60) -join '%0A'
            Write-Output "::error title=symdex (windows) pytest failure::$tail"
            exit 1
          }
        shell: pwsh

  security:
    name: Dependency CVEs + SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip pip-audit

      - name: Audit the four service LOCKS — what actually ships
        # `-r <lock>`, not "install into a venv then audit the venv". The venv
        # approach also audits pip-audit's OWN dependencies, so an unrelated CVE
        # in a CI tool would fail the product's gate. Auditing the file audits
        # exactly the pinned set the images install and nothing else.
        #
        # The locks, not requirements.txt: a fresh resolve tells you "the set
        # resolvable today is clean", which is not the question — the Dockerfiles
        # install requirements.lock. Each service has its own (bridge 74
        # packages, cortex 110), so each is audited separately.
        #
        # BLOCKING (--strict), deliberately. Verified green against all four
        # locks inside python:3.11-slim before this job was written. A gate that
        # starts red is one people learn to skip; starting from zero it stays
        # meaningful. When it fails it is telling you a customer is running a
        # known-vulnerable package — fix or pin, and if you ever add
        # --ignore-vuln, write the reason here.
        run: |
          for svc in cortex bridge sentinel relay; do
            echo "::group::$svc"
            pip-audit --progress-spinner off --strict -r "$svc/requirements.lock"
            echo "::endgroup::"
          done

      - name: Audit the two shipped wheels
        # client/ and symdex/ are libraries installed into a user's venv, so they
        # are deliberately NOT locked (pinning a library's transitive deps fights
        # the bootstrap's own resolution). They still need auditing, which means
        # resolving them — accepted, because for a wheel "what resolves" IS what
        # the user gets.
        run: |
          for pkg in client symdex; do
            echo "::group::$pkg"
            python -m venv "/tmp/audit-$pkg"
            # Upgrade the venv's OWN tooling before auditing. `python -m venv`
            # seeds pip and setuptools, and pip-audit sees them alongside the
            # real dependencies — a CVE in the venv's setuptools failed this
            # gate while being no part of what Firekeep ships. Same rationale
            # as upgrading pip: audit the product, not the scaffolding.
            "/tmp/audit-$pkg/bin/pip" install -q --upgrade pip setuptools
            "/tmp/audit-$pkg/bin/pip" install -q "./$pkg"
            # Remove the FIRST-PARTY distribution before auditing. pip-audit
            # --strict fails on any package it cannot resolve on PyPI, and
            # firekeep-client / firekeep-symdex are ours and have never been
            # published there — so --strict turned "this is our own code" into a
            # build failure. Uninstalling leaves exactly the third-party
            # dependency tree, which is the thing worth auditing, and keeps
            # --strict meaningful for everything else.
            "/tmp/audit-$pkg/bin/pip" uninstall -y -q "firekeep-$pkg"
            "/tmp/audit-$pkg/bin/pip" install -q pip-audit
            "/tmp/audit-$pkg/bin/pip-audit" --progress-spinner off --strict
            echo "::endgroup::"
          done

      - name: Generate CycloneDX SBOMs
        # An SBOM is only true for the resolution that produced it. For the four
        # services that resolution is the lock, so these are reproducible; for
        # the two wheels it is a point-in-time resolve. Uploaded rather than
        # committed either way — a stale committed SBOM is worse than none.
        run: |
          mkdir -p sbom
          for svc in cortex bridge sentinel relay; do
            pip-audit --progress-spinner off -r "$svc/requirements.lock"               --format cyclonedx-json --output "sbom/firekeep-$svc.cdx.json"
          done
          for pkg in client symdex; do
            "/tmp/audit-$pkg/bin/pip-audit" --progress-spinner off               --format cyclonedx-json --output "sbom/firekeep-$pkg.cdx.json"
          done
          ls -la sbom/
          # Fail rather than upload an empty bill of materials.
          for f in sbom/*.cdx.json; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # pipefail: the install step is `curl ... | tar -xz`. Without it a failed
    # download still exits 0 via tar, `gitleaks version` then fails confusingly,
    # or worse a stale binary on the PATH runs and the job goes green having
    # scanned with something other than what it claims.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential deleted in the working tree is still
          # live if it is reachable in a commit. This repo was seeded with
          # fresh history precisely because the predecessor's history published
          # a VPS address and a pre-redaction admin key.
          fetch-depth: 0
      # The gitleaks BINARY (MIT), not gitleaks/gitleaks-action@v2. The action
      # requires a paid GITLEAKS_LICENSE for GitHub *organization* accounts —
      # kapella-hub is one — and fails with a licence error rather than a scan
      # result. A security check that cannot run is worse than none, because
      # the job name in the checks list says it did.
      - name: Install gitleaks
        run: |
          VER=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree and full history
        # Two passes: `detect` walks every commit (a credential deleted from the
        # working tree is still live if any commit reaches it), `dir` catches
        # anything staged but not yet committed. --redact so a finding does not
        # reprint the secret into a log that is itself readable.
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1
          gitleaks dir . --redact --verbose --exit-code 1

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    # Scans every package actually shipped to a customer, each in its own
    # clean venv -- installing them into one shared environment (or one
    # `pip install` invocation) would merge the results and mean nothing.
    # cortex/requirements.txt covers bridge/relay/sentinel too (their deps
    # are subsets of it). client/ and symdex/ are the two packages shipped
    # to every customer as wheels (firekeep-client, firekeep-symdex) and were
    # never scanned before this -- symdex in particular pulls
    # tree-sitter-language-pack, a bundle of many third-party grammars the
    # gate had never seen. Base installs only (no [all]/[test] extras) --
    # base is what a customer's `pip install` actually resolves.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit-test the gate
        run: pip install pytest && pytest tests/test_check_licenses.py -q
      - name: Gate cortex (+ bridge/relay/sentinel superset) dependencies
        run: |
          python -m venv /tmp/venv-cortex
          /tmp/venv-cortex/bin/pip install -q -r cortex/requirements.txt
          /tmp/venv-cortex/bin/python scripts/check_licenses.py
      - name: Gate client (firekeep-client wheel) dependencies
        run: |
          python -m venv /tmp/venv-client
          /tmp/venv-client/bin/pip install -q ./client
          /tmp/venv-client/bin/python scripts/check_licenses.py
      - name: Gate symdex (firekeep-symdex wheel) dependencies
        run: |
          python -m venv /tmp/venv-symdex
          /tmp/venv-symdex/bin/pip install -q ./symdex
          /tmp/venv-symdex/bin/python scripts/check_licenses.py

  benchmarks:
    name: benchmarks (LongMemEval harness)
    runs-on: ubuntu-latest
    # NOTHING RAN THESE. `benchmarks/memory/` carries the Dreaming ship gate —
    # `bench.dream_ab`'s aggregate comparator and `bench.displacement`'s
    # evidence-displacement analysis — and no job in this file referenced
    # `benchmarks/` at all, so the tests pinning those gates (including the ones
    # pinning displacement to a hand audit of two real run records) were a
    # local-only courtesy. A gate whose own guards do not run is the same class
    # of decoration as the forbidden-token scan that could not fail.
    #
    # No dataset, no containers, no network: `data/` is gitignored (265 MB) and
    # the ground-truth tests read the committed 32 KB evidence extract at
    # tests/fixtures/ instead. The two assertions that genuinely need the raw
    # dataset skip themselves and say so.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install harness dependencies
        run: pip install -r benchmarks/memory/requirements.txt
      # `python -m pytest`, not `pytest` — the console script does not put the
      # CWD on sys.path, and both `bench` and `tests.conftest` are imported by
      # package path (the same trap documented on the repo-scripts job above).
      - name: Run harness tests
        run: cd benchmarks/memory && python -m pytest tests -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    # Blocking: the tree is ruff-clean (select=E4,E7,E9,F per ruff.toml). Keep it green.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6,<1"
      - name: Run ruff
        run: ruff check .

  forbidden-tokens:
    name: Forbidden-token scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The guard must be able to fail. Its own tests plant each token and
      # assert detection -- an earlier shell version silently passed while a
      # residual sat in the tree, which is how a check becomes decoration.
      - name: Prove the guard can detect a plant
        run: pip install pytest && python -m pytest tests/test_forbidden_tokens.py -q
      - name: Scan the tree
        run: python scripts/check_forbidden_tokens.py .
