name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cortex: fully-mocked suite. requirements.txt brings scikit-learn
          # (-> joblib) so the full suite incl. test_ranker runs, and also provides
          # every dep the shared modules (replay/auth/vault/corpus) need — they are
          # imported via sys.path by cortex/tests/conftest.py.
          - name: cortex
            install: pip install -r cortex/requirements.txt -r cortex/requirements-dev.txt
            test: pytest cortex/tests -q
          - name: bridge
            install: pip install -r bridge/requirements.txt pytest pytest-asyncio httpx
            test: pytest bridge/tests -q
          - name: sentinel
            install: pip install -r sentinel/requirements.txt -r sentinel/requirements-dev.txt
            test: pytest sentinel/tests -q
          - name: relay
            install: pip install -r relay/requirements.txt -r relay/requirements-dev.txt
            test: pytest relay/tests -q
          - name: symdex
            install: pip install -e "symdex[test]"
            test: pytest symdex/tests -q
          # Shared libraries — no requirements files of their own (deps live in
          # cortex/requirements.txt). All tests use fakeredis; no live backends.
          - name: shared-modules
            install: pip install -r cortex/requirements.txt pytest pytest-asyncio fakeredis
            test: pytest replay/tests auth/tests vault/tests corpus/tests -q
          # Client kit: package smoke test + the import-boundary guard. Pure
          # stdlib + pytest — no mcp/httpx install, so the boundary job can never
          # itself smuggle the deps it forbids. `cd client` puts firekeep_client on
          # sys.path; the boundary walker reaches symdex/src via the repo root.
          - name: client
            install: pip install pytest
            test: cd client && python -m pytest tests -q
          # Root tests/ — deploy scripts, provenance, backup/restore, the support
          # bundle, and the install/update health-probe guard. NOTHING RAN THESE
          # IN CI: the `licenses` and `forbidden-tokens` jobs each invoke one
          # single FILE from this directory, which is what made the gap look
          # covered. 123 tests over the install path, and the install path is
          # where the defects have actually been. pytest + pyyaml only (the
          # compose-provenance checks parse docker-compose.yml); bash comes with
          # the runner and test_install_health_probe.py needs a real one.
          - name: repo-scripts
            install: pip install pytest pyyaml
            test: pytest tests -q
          # deploy/tests/test_auth_posture.sh drives install.sh's and
          # deploy/lib.sh's summary/warning logic in a sandbox — no Docker, no
          # network, no containers. It is the only thing that checks the text an
          # operator is shown about auth posture and port exposure, which is
          # where two false-reassurance defects have already shipped (a
          # "Vault: Enabled" line for a vault that answers 503, and firewall
          # advice that Docker bypasses). It ran nowhere until now.
          # Its siblings in deploy/tests/ DO need Docker and stay out of CI.
          - name: deploy-posture
            install: "true"
            test: bash deploy/tests/test_auth_posture.sh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: ${{ matrix.install }}
      - name: Run tests
        run: ${{ matrix.test }}

  client-windows:
    name: client (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # The POSIX bootstrap tests self-skip on nt; the PowerShell ones un-skip here.
      # This job exists to execute install.ps1 at all -- nothing else in CI ever does.
      #
      # Two separate steps, not `cd client && ...`: the default shell for `run:` on
      # windows-latest is pwsh, and this job's only reason to exist is to actually run
      # things nobody can verify on POSIX CI -- it should not itself lean on an assumption
      # about pwsh's `&&` chaining that nobody here can check.
      - run: pip install pytest
      # On failure, surface the pytest tail as ONE ::error:: annotation: annotations
      # are publicly readable on this repo while raw job logs require auth, and
      # nobody on the team has a Windows box — this job must be debuggable from the
      # public API alone.
      - run: |
          python -m pytest tests -q 2>&1 | Tee-Object -FilePath pytest-out.txt
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content pytest-out.txt -Tail 60) -join '%0A'
            Write-Output "::error title=client (windows) pytest failure::$tail"
            exit 1
          }
        shell: pwsh
        working-directory: client

  symdex-windows:
    name: symdex (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # symdex/src/firekeep_symdex/storage/index_store.py selects its history-file
      # locking primitive by `try: import fcntl / except ImportError: import msvcrt`,
      # so the ubuntu `symdex` matrix entry above can only ever take the POSIX
      # branch. This job is the only place in CI that reaches the msvcrt branch,
      # mirroring client-windows above it.
      #
      # It exists because that branch was added blind: an unconditional `import
      # fcntl` had made every save_index() call raise on Windows (150 failed,
      # 31 collection errors) and no CI job could see it. A platform branch with
      # no CI on the other side is an untested branch -- this is the gate, not
      # the fix.
      - run: pip install -e "symdex[test]"
      # On failure, surface the pytest tail as ONE ::error:: annotation: annotations
      # are publicly readable on this repo while raw job logs require auth, and
      # nobody on the team has a Windows box — this job must be debuggable from the
      # public API alone.
      - run: |
          python -m pytest symdex/tests -q 2>&1 | Tee-Object -FilePath pytest-out.txt
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content pytest-out.txt -Tail 60) -join '%0A'
            Write-Output "::error title=symdex (windows) pytest failure::$tail"
            exit 1
          }
        shell: pwsh

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    # Scans every package actually shipped to a customer, each in its own
    # clean venv -- installing them into one shared environment (or one
    # `pip install` invocation) would merge the results and mean nothing.
    # cortex/requirements.txt covers bridge/relay/sentinel too (their deps
    # are subsets of it). client/ and symdex/ are the two packages shipped
    # to every customer as wheels (firekeep-client, firekeep-symdex) and were
    # never scanned before this -- symdex in particular pulls
    # tree-sitter-language-pack, a bundle of many third-party grammars the
    # gate had never seen. Base installs only (no [all]/[test] extras) --
    # base is what a customer's `pip install` actually resolves.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit-test the gate
        run: pip install pytest && pytest tests/test_check_licenses.py -q
      - name: Gate cortex (+ bridge/relay/sentinel superset) dependencies
        run: |
          python -m venv /tmp/venv-cortex
          /tmp/venv-cortex/bin/pip install -q -r cortex/requirements.txt
          /tmp/venv-cortex/bin/python scripts/check_licenses.py
      - name: Gate client (firekeep-client wheel) dependencies
        run: |
          python -m venv /tmp/venv-client
          /tmp/venv-client/bin/pip install -q ./client
          /tmp/venv-client/bin/python scripts/check_licenses.py
      - name: Gate symdex (firekeep-symdex wheel) dependencies
        run: |
          python -m venv /tmp/venv-symdex
          /tmp/venv-symdex/bin/pip install -q ./symdex
          /tmp/venv-symdex/bin/python scripts/check_licenses.py

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    # Blocking: the tree is ruff-clean (select=E4,E7,E9,F per ruff.toml). Keep it green.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6,<1"
      - name: Run ruff
        run: ruff check .

  forbidden-tokens:
    name: Forbidden-token scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The guard must be able to fail. Its own tests plant each token and
      # assert detection -- an earlier shell version silently passed while a
      # residual sat in the tree, which is how a check becomes decoration.
      - name: Prove the guard can detect a plant
        run: pip install pytest && python -m pytest tests/test_forbidden_tokens.py -q
      - name: Scan the tree
        run: python scripts/check_forbidden_tokens.py .
